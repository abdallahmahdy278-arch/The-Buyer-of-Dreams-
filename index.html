<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>بائعة الأحلام</title>
<meta name="google-site-verification" content="lbu-K_ctUG_UnNtplW7TMyoLlybaM8QAAkhsG2ciWz4" />
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@400;500;700&family=Cairo:wght@400;600;700&family=Reem+Kufi:wght@400;700&family=Lemonada:wght@400;700&family=Changa:wght@400;600;700&family=Scheherazade+New:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Noto+Serif+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@400;500;600;700&family=Markazi+Text:wght@400;500;600;700&family=Readex+Pro:wght@400;500;600;700&family=El+Messiri:wght@400;500;600;700&family=Mada:wght@400;500;600;700&family=Marhey:wght@400;500;600;700&family=Lateef:wght@400;500;600;700&family=Harmattan:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --primary:#8B1A1A; --gold:#C9A227; --text:#3E3A39; --bg:#FAF3E8; --card:#FFFDF8;
  --base-font:'Tajawal',sans-serif; --heading-font:'Aref Ruqaa',serif;
  --base-size:17px; --heading-size:32px;
  --radius:14px; --shadow:0 8px 28px rgba(80,40,20,.10);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--base-font);background:var(--bg);color:var(--text);font-size:var(--base-size);line-height:1.9;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
button{cursor:pointer;font-family:inherit}
.hidden{display:none!important}

/* ===== الهيرو ===== */
header.site-header{position:sticky;top:0;z-index:100;background:var(--card);border-bottom:2px solid var(--gold);box-shadow:0 2px 12px rgba(80,40,20,.07)}
.header-inner{max-width:1180px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{font-family:var(--heading-font);font-size:26px;color:var(--primary);font-weight:700;display:flex;align-items:center;gap:8px}
.brand .dot{color:var(--gold);font-size:20px}
nav.main-nav{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
nav.main-nav a{padding:8px 13px;border-radius:30px;font-weight:500;font-size:15.5px;color:var(--text);transition:.25s}
nav.main-nav a:hover{background:rgba(201,162,39,.14);color:var(--primary)}
nav.main-nav a.admin-link{background:var(--primary);color:#FFF8EC;border-radius:30px}
nav.main-nav a.admin-link:hover{background:#6f1414}
.menu-btn{display:none;background:none;border:1.5px solid var(--primary);color:var(--primary);border-radius:10px;padding:6px 12px;font-size:20px;line-height:1}

.hero{max-width:1180px;margin:0 auto;padding:56px 20px 30px;display:grid;grid-template-columns:1.15fr .85fr;gap:44px;align-items:center}
.hero-text h1{font-family:var(--heading-font);color:var(--primary);font-size:clamp(40px,6vw,64px);line-height:1.35;margin-bottom:24px}
.hero-text .tagline{color:var(--text);font-size:clamp(17px,2.3vw,21px);line-height:2;border-right:4px solid var(--gold);padding-right:16px;margin-bottom:46px}
.quote-box{background:var(--card);border:1px solid rgba(201,162,39,.5);border-radius:var(--radius);padding:50px 30px 30px;box-shadow:var(--shadow);position:relative}
.quote-box::before{content:'❝';position:absolute;top:-20px;right:24px;font-size:60px;color:var(--gold);font-family:serif}
.quote-box .quote-text{white-space:pre-wrap}
.hero-img{border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;border:1px solid rgba(201,162,39,.4)}
.hero-img img{width:100%;height:100%;max-height:430px;object-fit:cover}
.hero-img .img-empty{height:320px;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#fdf6e7,#f3e6c8);color:var(--gold);font-family:var(--heading-font);font-size:22px;text-align:center;padding:20px}

.daily{max-width:980px;margin:10px auto 0;padding:0 20px}
.daily-card{background:linear-gradient(145deg,var(--card),#fbf1dd);border:1px solid rgba(201,162,39,.45);border-radius:var(--radius);padding:34px 38px;text-align:center;box-shadow:var(--shadow);position:relative}
.daily-card h3{font-family:var(--heading-font);color:var(--gold);font-size:22px;margin-bottom:14px;letter-spacing:.5px}
.daily-card .daily-text{white-space:pre-wrap}

.cards{max-width:1180px;margin:0 auto;padding:56px 20px 20px;display:grid;grid-template-columns:repeat(3,1fr);gap:26px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:36px 26px;text-align:center;border:1px solid rgba(201,162,39,.35);transition:transform .3s,box-shadow .3s;display:flex;flex-direction:column;gap:8px}
.card:hover{transform:translateY(-6px);box-shadow:0 16px 40px rgba(80,40,20,.16)}
.card .icon{font-size:44px}
.card h3{font-family:var(--heading-font);color:var(--primary);font-size:24px}
.card p{color:var(--text);opacity:.85;font-size:15.5px}

.page{max-width:980px;margin:0 auto;padding:44px 20px;width:100%}
.page h2.page-title{font-family:var(--heading-font);color:var(--primary);font-size:var(--heading-size);text-align:center;margin-bottom:10px}
.subtitle{text-align:center;color:var(--gold);font-weight:500;margin-bottom:34px}
.back-link{display:inline-block;margin-bottom:24px;color:var(--primary);font-weight:700;border-bottom:2px solid var(--gold);padding-bottom:2px}
.back-link:hover{opacity:.75}

/* ===== الكتاب ===== */
.blurb-box{background:var(--card);border:1px solid rgba(201,162,39,.45);border-radius:var(--radius);box-shadow:var(--shadow);padding:30px 34px;margin-bottom:34px;white-space:pre-wrap}
.chapters h3{font-family:var(--heading-font);color:var(--primary);font-size:24px;margin-bottom:18px}
.chapter-item{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid rgba(201,162,39,.4);border-radius:12px;padding:16px 22px;margin-bottom:12px;box-shadow:0 3px 10px rgba(80,40,20,.06);transition:.25s;font-size:18px;font-weight:600;color:var(--text);text-decoration:none}
.chapter-item:hover{background:var(--primary);color:#FFF8EC;transform:translateX(4px)}
.chapter-item .num{color:var(--gold);font-family:var(--heading-font);margin-left:10px}
.chapter-item:hover .num{color:#ffe9a8}

.chapter-content{background:var(--card);border:1px solid rgba(201,162,39,.4);border-radius:var(--radius);box-shadow:var(--shadow);padding:38px 42px}
.chapter-content.is-plain{white-space:pre-wrap}
.chapter-content p{margin:0 0 16px}
.chapter-content p:last-child{margin-bottom:0}
.chapter-content h1,.chapter-content h2,.chapter-content h3{font-family:var(--hfont,'Aref Ruqaa'),serif;color:var(--hcolor,#8B1A1A);margin:1.3em 0 .55em;line-height:1.4}
.chapter-content h1{font-size:calc(var(--hsize,28px) * 1.2)}
.chapter-content h2{font-size:var(--hsize,28px)}
.chapter-content h3{font-size:calc(var(--hsize,28px) * 0.85)}
.chapter-content ul,.chapter-content ol{margin:0 0 16px;padding-right:1.9em}
.chapter-content li{margin-bottom:6px}
.chapter-content blockquote{border-right:4px solid var(--gold);padding-right:14px;margin:0 0 16px;font-style:italic}
.chapter-content img{max-width:100%;border-radius:10px;margin:8px 0}
.chapter-content a{color:var(--primary);border-bottom:1px solid var(--gold)}
.chapter-content pre.ql-syntax,.chapter-content .ql-code-block{background:#f5efe0;direction:ltr;text-align:left;font-family:monospace;padding:14px;border-radius:8px;margin:0 0 16px;white-space:pre-wrap}
.chapter-content .ql-align-center{text-align:center}
.chapter-content .ql-align-right{text-align:right}
.chapter-content .ql-align-left{text-align:left}
.chapter-content .ql-align-justify{text-align:justify}
.chapter-content .ql-direction-rtl{direction:rtl;text-align:right}
.chapter-content .ql-direction-ltr{direction:ltr;text-align:left}
.chapter-content .ql-indent-1{margin-right:2.2em}
.chapter-content .ql-indent-2{margin-right:4.4em}
.chapter-content .ql-indent-3{margin-right:6.6em}
.chapter-content .ql-indent-4{margin-right:8.8em}
.chapter-content .ql-indent-5{margin-right:11em}
.chapter-content .ql-indent-6{margin-right:13.2em}
.chapter-content .ql-indent-7{margin-right:15.4em}
.chapter-content .ql-indent-8{margin-right:17.6em}
.chapter-content .ql-indent-9{margin-right:19.8em}
.chapter-content .ql-size-small{font-size:.75em}
.chapter-content .ql-size-large{font-size:1.5em}
.chapter-content .ql-size-huge{font-size:2.5em}
.chapter-content .ql-super{font-size:75%;vertical-align:super}
.chapter-content .ql-sub{font-size:75%;vertical-align:sub}

/* ===== بلوك القصيدة — مُوحَّد بين صفحة القصائد وداخل الفصل ===== */
.poem-display{background:linear-gradient(145deg,#fffaf0,#fbf1dd);border:1px solid rgba(201,162,39,.55);border-radius:var(--radius);padding:34px 30px;position:relative;box-shadow:0 6px 22px rgba(80,40,20,.10);margin:24px 0}
.poem-display::before{content:'✦';position:absolute;top:-14px;inset-inline-start:24px;background:var(--card);color:var(--gold);width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;border:1px solid rgba(201,162,39,.5)}
.poem-display .pd-title{font-family:var(--heading-font);color:var(--primary);font-size:26px;text-align:center;margin-bottom:8px}
.poem-display .pd-type{display:block;margin:0 auto 16px;width:fit-content;background:rgba(201,162,39,.18);color:#8a6d1c;border-radius:30px;padding:4px 16px;font-size:13.5px}
.poem-display .pd-reason{background:rgba(255,255,255,.55);border-right:3px solid var(--gold);border-radius:8px;padding:14px 18px;margin-bottom:22px;white-space:pre-wrap;font-size:15px;color:#5c4f3e}
.poem-display .pd-body{background:rgba(255,255,255,.6);border-radius:10px;padding:30px 22px;text-align:center;white-space:pre-wrap}

/* ⭐ محاذاة الشطر العمودي الثابتة — CSS Grid، لا مسافات Space، لا flex-wrap */
.poem-display .bayt{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  gap:16px;
  align-items:center;
  direction:rtl;
  margin:0 auto 18px;
  max-width:780px;
}
.poem-display .bayt .b-a{text-align:start;justify-self:start}
.poem-display .bayt .b-sep{color:var(--gold);font-weight:700;font-size:1.15em;white-space:nowrap;justify-self:center}
.poem-display .bayt .b-b{text-align:end;justify-self:end}
@media (max-width:540px){
  .poem-display .bayt{grid-template-columns:1fr;gap:6px;text-align:center;margin-bottom:22px;max-width:100%}
  .poem-display .bayt .b-a,.poem-display .bayt .b-b{text-align:center;justify-self:stretch}
  .poem-display .bayt .b-sep{justify-self:center}
}

/* ===== قائمة القصائد ===== */
.poem-item{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid rgba(201,162,39,.4);border-radius:12px;padding:16px 22px;margin-bottom:12px;box-shadow:0 3px 10px rgba(80,40,20,.06);transition:.25s;text-decoration:none;color:inherit}
.poem-item:hover{background:var(--primary);color:#FFF8EC;transform:translateX(4px)}
.poem-item .p-title{font-weight:700;font-size:18px}
.poem-item .p-type{font-size:12.5px;background:rgba(201,162,39,.16);color:#8a6d1c;border-radius:30px;padding:3px 12px;white-space:nowrap}
.poem-item:hover .p-type{background:rgba(255,255,255,.18);color:#ffe9a8}

/* ===== واجهة المحتوى المغلق ===== */
.locked-screen{background:var(--card);border:1px solid rgba(201,162,39,.4);border-radius:var(--radius);box-shadow:var(--shadow);padding:80px 30px;text-align:center;max-width:640px;margin:30px auto}
.locked-screen .lock-icon{font-size:74px;color:var(--gold);margin-bottom:18px;display:block;line-height:1}
.locked-screen .lock-title{font-family:var(--heading-font);color:var(--primary);font-size:28px;margin-bottom:10px}
.locked-screen .lock-msg{color:#5c4f3e;font-size:17px;margin-bottom:24px}
.locked-screen .lock-divider{width:80px;height:2px;background:var(--gold);margin:0 auto 22px;border-radius:2px}

.vid-frame{position:relative;width:100%;aspect-ratio:16/9;margin-top:32px;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);border:1px solid rgba(201,162,39,.4)}
.vid-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

/* ===== المقتطفات ===== */
.excerpt-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:30px 34px;margin-bottom:22px;border:1px solid rgba(201,162,39,.35)}
.excerpt-card .e-title{font-family:var(--heading-font);color:var(--primary);font-size:23px;margin-bottom:12px}
.excerpt-card .e-text{color:var(--text)}
.excerpt-card .e-text p{margin:0 0 10px}
.excerpt-card .e-text p:last-child{margin-bottom:0}
.excerpt-card .e-text span[style*="color"]{outline:none}

/* ===== عن الكاتب ===== */
.about-body{background:var(--card);border:1px solid rgba(201,162,39,.45);border-radius:var(--radius);box-shadow:var(--shadow);padding:38px 42px;white-space:pre-wrap}

/* ===== التواصل ===== */
.contact-form{background:var(--card);border:1px solid rgba(201,162,39,.45);border-radius:var(--radius);box-shadow:var(--shadow);padding:38px 42px;max-width:640px;margin:0 auto}
.contact-form .f-label{display:block;margin-bottom:8px;font-weight:700;color:var(--primary)}
.contact-form input,.contact-form textarea{width:100%;border:1.5px solid #e8dcc0;border-radius:10px;padding:13px 16px;font-family:inherit;font-size:16px;background:#fffdf8;margin-bottom:18px;outline:none;transition:.25s}
.contact-form input:focus,.contact-form textarea:focus{border-color:var(--primary)}
.contact-form textarea{min-height:150px;resize:vertical}
.btn-primary{background:var(--primary);color:#FFF8EC;border:none;border-radius:30px;padding:13px 36px;font-size:17px;font-weight:700;transition:.25s}
.btn-primary:hover{background:#6f1414;transform:translateY(-2px)}
.btn-primary:disabled{opacity:.6;cursor:not-allowed}

/* ===== الفوتر ===== */
footer.site-footer{margin-top:auto;background:#2c1a12;color:#e9dfc9;text-align:center;padding:34px 20px 26px;border-top:3px solid var(--gold)}
.social-row{display:flex;justify-content:center;gap:16px;margin-bottom:18px}
.social-row a{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.09);display:flex;align-items:center;justify-content:center;transition:.25s;border:1px solid rgba(201,162,39,.35)}
.social-row a:hover{background:var(--gold);color:#2c1a12;transform:translateY(-3px)}
.social-row svg{width:20px;height:20px;fill:currentColor}
.copy{font-size:14.5px;opacity:.85}

.loader{text-align:center;padding:80px 20px;color:var(--gold);font-family:var(--heading-font);font-size:22px}
.empty{text-align:center;padding:40px 20px;color:var(--text);opacity:.65;font-size:17px}
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--primary);color:#FFF8EC;padding:14px 30px;border-radius:40px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:300;transition:.35s;font-weight:500;max-width:90vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}

@media(max-width:900px){
.hero{grid-template-columns:1fr;padding-top:36px}
.cards{grid-template-columns:1fr;padding-top:40px}
.menu-btn{display:block}
nav.main-nav{display:none;width:100%;flex-direction:column;align-items:stretch;padding-top:10px}
nav.main-nav.open{display:flex}
nav.main-nav a{text-align:center}
.chapter-content,.about-body,.contact-form,.poem-display{padding:26px 20px}
}
</style>
</head>

<footer class="site-footer">

<script>
function esc(s){
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

/* ⭐ تنظيف HTML آمن مع السماح ببلوك القصيدة داخل الفصل وحفظ data-poem-id */
function sanitizeHtml(html){
  var allowTags = {P:1,DIV:1,SPAN:1,BR:1,H1:1,H2:1,H3:1,H4:1,H5:1,H6:1,UL:1,OL:1,LI:1,BLOCKQUOTE:1,STRONG:1,EM:1,B:1,I:1,U:1,S:1,A:1,PRE:1,CODE:1,IMG:1,SUB:1,SUP:1};
  var doc = new DOMParser().parseFromString(String(html || ''), 'text/html');
  doc.querySelectorAll('script,iframe,object,embed,link,meta,style,form,input,button,textarea,select,table,thead,tbody,tr,td,th').forEach(function(n){ n.remove(); });
  function walk(node){
    var kids = Array.from(node.children);
    kids.forEach(function(n){
      var tag = n.tagName;
      if (!allowTags[tag]) {
        var parent = n.parentNode;
        while (n.firstChild) parent.insertBefore(n.firstChild, n);
        parent.removeChild(n);
        return;
      }
      var cls = n.getAttribute('class') || '';
      var isPoemBlock = tag === 'DIV' && cls.indexOf('poem-display') !== -1;
      var isBayt      = tag === 'DIV' && cls.indexOf('bayt') !== -1;
      var kw = ['poem-display','poem-ref','pd-title','pd-body','pd-type','pd-reason','bayt','b-a','b-b','b-sep'];
      Array.from(n.attributes).forEach(function(a){
        var nm = a.name.toLowerCase();
        var v  = (a.value || '').trim().toLowerCase();
        if (nm === 'class') {
          var raw = (a.value || '').split(/\s+/);
          var safe = raw.filter(function(c){ return kw.indexOf(c) !== -1 || /^ql-/.test(c); });
          if (safe.length === 0) n.removeAttribute('class'); else n.setAttribute('class', safe.join(' '));
        } else if (nm === 'style') {
          var decls = (a.value || '').split(';').map(function(s){return s.trim();}).filter(Boolean);
          var ok = decls.filter(function(d){
            var k = d.split(':')[0].trim().toLowerCase();
            return /^(color|background(-color)?|font(-size|-family|-style|-weight)?|line-height|text-align|direction)$/.test(k);
          });
          if (ok.length === 0) n.removeAttribute('style'); else n.setAttribute('style', ok.join(';'));
        } else if (nm.indexOf('on') === 0) {
          n.removeAttribute(a.name);
        } else if ((nm === 'href' || nm === 'src') && v.indexOf('javascript:') === 0) {
          n.removeAttribute(a.name);
        } else if (nm !== 'href' && nm !== 'target' && nm !== 'rel' && nm !== 'src' && nm !== 'alt' && nm !== 'title' && nm !== 'data-poem-id') {
          n.removeAttribute(a.name);
        }
      });
      walk(n);
    });
  }
  walk(doc.body);
  return doc.body.innerHTML;
}

function isRichHtml(content){
  return /<(p|div|span|br|h[1-6]|ul|ol|li|blockquote|strong|em|b|i|u)[\s>]/i.test(String(content || ''));
}

function showToast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(function(){ t.classList.remove('show'); }, 2600);
}

function youtubeEmbed(url){
  if (!url || !String(url).trim()) return '';
  var m = String(url).match(/(?:youtube\.com\/(?:watch\?.*v=|embed\/|shorts\/|live\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/);
  if (!m) return '';
  return '<div class="vid-frame"><iframe src="https://www.youtube.com/embed/' + m[1] + '" allowfullscreen loading="lazy"></iframe></div>';
}

var CONTENT = null;
var app = document.getElementById('app');

/* ⭐ إصلاح: بناء قيم الخطوط بدمج نصوص (كان الكود يستخدم template داخل علامات مفردة فيسبب ظهور ${t.baseFont} كنص) */
function applyTheme(t){
  var r = document.documentElement.style;
  r.setProperty('--primary', t.primaryColor);
  r.setProperty('--gold', t.goldColor);
  r.setProperty('--text', t.textColor);
  r.setProperty('--bg', t.bgColor);
  r.setProperty('--card', t.cardColor);
  r.setProperty('--base-font', "'" + t.baseFont + "',sans-serif");
  r.setProperty('--heading-font', "'" + t.headingFont + "',serif");
  r.setProperty('--base-size', (t.baseSize || 17) + 'px');
  r.setProperty('--heading-size', (t.headingSize || 32) + 'px');
}

var SOCIAL_ICONS = {
  youtube:'<svg viewBox="0 0 24 24"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2C0 8.1 0 12 0 12s0 3.9.5 5.8a3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1c.5-1.9.5-5.8.5-5.8s0-3.9-.5-5.8zM9.6 15.6V8.4l6.4 3.6-6.4 3.6z"/></svg>',
  instagram:'<svg viewBox="0 0 24 24"><path d="M12 2.2c3.2 0 3.6 0 4.8.1 1.2.1 1.8.3 2.2.4.6.2 1 .5 1.4.9.4.4.7.9.9 1.4.2.4.4 1.1.4 2.2.1 1.2.1 1.6.1 4.8s0 3.6-.1 4.8c-.1 1.2-.3 1.8-.4 2.2-.2.6-.5 1-.9 1.4-.4.4-.9.7-1.4.9-.4.2-1.1.4-2.2.4-1.2.1-1.6.1-4.8.1s-3.6 0-4.8-.1c-1.2-.1-1.8-.3-2.2-.4a3.7 3.7 0 0 1-1.4-.9 3.7 3.7 0 0 1-.9-1.4c-.2-.4-.4-1.1-.4-2.2C2.2 15.6 2.2 15.2 2.2 12s0-3.6.1-4.8c.1-1.2.3-1.8.4-2.2.2-.6.5-1 .9-1.4.4-.4.9-.7 1.4-.9.4-.2 1.1-.4 2.2-.4C8.4 2.2 8.8 2.2 12 2.2zm0 5.3a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9zm5.4-.9a1.1 1.1 0 1 0 0-2.2 1.1 1.1 0 0 0 0 2.2zM12 9.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5z"/></svg>',
  facebook:'<svg viewBox="0 0 24 24"><path d="M22 12a10 10 0 1 0-11.6 9.9v-7H8v-3h2.4V9.4c0-2.4 1.4-3.7 3.6-3.7 1 0 2.1.2 2.1.2v2.3h-1.2c-1.2 0-1.5.7-1.5 1.5V12h2.6l-.4 3h-2.2v7A10 10 0 0 0 22 12z"/></svg>',
  tiktok:'<svg viewBox="0 0 24 24"><path d="M19.6 6.9a4.6 4.6 0 0 1-3.4-1.4V16a5.5 5.5 0 1 1-5.5-5.5c.3 0 .6 0 .9.1v2.7a2.8 2.8 0 1 0 2 2.7V2h2.7a4.6 4.6 0 0 0 3.3 4.5v.4z"/></svg>'
};
function renderSocial(){
  var row = document.getElementById('socialRow');
  var s = (CONTENT && CONTENT.social) || {};
  var links = [['youtube', s.youtube], ['instagram', s.instagram], ['facebook', s.facebook], ['tiktok', s.tiktok]];
  row.innerHTML = links.map(function(p){
    var k = p[0], u = p[1];
    return u ? '<a href="' + esc(u) + '" target="_blank" rel="noopener">' + SOCIAL_ICONS[k] + '</a>' : '';
  }).join('');
}

function parseHash(){
  var h = location.hash.replace(/^#\/?/, '');
  var parts = h.split('/').filter(Boolean);
  return { route: parts[0] || 'home', id: parts[1] || null };
}
function route(){
  var r = parseHash();
  if (r.route === 'home') renderHome();
  else if (r.route === 'book') renderBook();
  else if (r.route === 'chapter' && r.id) renderChapter(r.id);
  else if (r.route === 'poems') renderPoems();
  else if (r.route === 'poem' && r.id) renderPoem(r.id);
  else if (r.route === 'excerpts') renderExcerpts();
  else if (r.route === 'about') renderAbout();
  else if (r.route === 'contact') renderContact();
  else renderHome();
  document.getElementById('mainNav').classList.remove('open');
  window.scrollTo({ top: 0, behavior: 'instant' });
}

/* شاشة الإغلاق — تظهر في صفحة التفاصيل فقط، والقائمة لا تُظهر شيئًا */
function lockedScreen(kind){
  var backRoute = (kind === 'poem') ? 'poems' : 'book';
  var label = (kind === 'poem') ? 'القصيدة' : 'الفصل';
  return ''+
    '<a href="#/' + backRoute + '" class="back-link">→ العودة</a>'+
    '<div class="locked-screen">'+
      '<span class="lock-icon" aria-hidden="true">🔒</span>'+
      '<div class="lock-divider"></div>'+
      '<div class="lock-title">هذا ' + label + ' مغلق حاليًا</div>'+
      '<div class="lock-msg">يسعدنا إطلاعك على هذا المحتوى في وقت لاحق. عد لاحقًا، فالأبواب الأدبية تُفتح حين يحين وقتها.</div>'+
      '<a href="#/' + backRoute + '" class="btn-primary" style="display:inline-block">العودة للقائمة</a>'+
    '</div>';
}

function renderHome(){
  var c = CONTENT, hero = c.hero, daily = c.dailyExcerpt;
  var quoteStyle = 'font-family:' + esc(hero.quote.font) + ',serif;font-size:' + (hero.quote.fontSize || 26) + 'px;color:' + esc(hero.quote.color) + ';line-height:' + (hero.quote.lineHeight || 2);
  var img = hero.imageUrl && hero.imageUrl.trim()
    ? '<img src="' + esc(hero.imageUrl) + '" alt="">'
    : '<div class="img-empty">صورة الموقع<br>— من لوحة التحكم —</div>';
  app.innerHTML =
    '<section class="hero">'+
      '<div class="hero-text">'+
        '<h1>' + esc(c.site.name) + '</h1>'+
        '<p class="tagline">' + esc(c.site.tagline) + '</p>'+
        '<div class="quote-box"><div class="quote-text" style="' + quoteStyle + '">' + esc(hero.quote.text) + '</div></div>'+
      '</div>'+
      '<div class="hero-img">' + img + '</div>'+
    '</section>'+
    '<section class="daily">'+
      '<div class="daily-card">'+
        '<h3>✦ مقتطف اليوم ✦</h3>'+
        '<div class="daily-text">' + esc(daily.text) + '</div>'+
      '</div>'+
    '</section>'+
    '<section class="cards">'+
      '<a class="card" href="#/book"><div class="icon">📖</div><h3>' + esc(c.book.title) + '</h3><p>فصول الكتاب وحكاياته</p></a>'+
      '<a class="card" href="#/poems"><div class="icon">🌙</div><h3>القصائد</h3><p>شعر عمودي وشعر حر</p></a>'+
      '<a class="card" href="#/excerpts"><div class="icon">🕊️</div><h3>مقتطفات شعرية</h3><p>خواطر ومقتطفات مختارة</p></a>'+
    '</section>'+
    aboutSectionHTML()+
    contactSectionHTML();
  bindContactForm();
}

/* ⭐ صفحة الكتاب — لا تُظهر أي إشارة لحالة الفصل في القائمة (لا 🔒، لا "مغلق") */
function renderBook(){
  var b = CONTENT.book;
  var blurb = b.blurb;
  var blurbStyle = 'font-family:' + esc(blurb.font) + ',sans-serif;font-size:' + (blurb.fontSize || 18) + 'px;color:' + esc(blurb.color) + ';line-height:' + (blurb.lineHeight || 1.9);
  app.innerHTML =
    '<a href="#/home" class="back-link">→ الرئيسية</a>'+
    '<h2 class="page-title">' + esc(b.title) + '</h2>'+
    '<div class="subtitle">رحلة بين الفصول</div>'+
    '<div class="blurb-box" style="' + blurbStyle + '">' + esc(blurb.text) + '</div>'+
    '<div class="chapters"><h3>فصول الكتاب</h3>'+
      (b.chapters.length
        ? b.chapters.map(function(ch, i){
            return '<a class="chapter-item" href="#/chapter/' + ch.id + '"><span class="num">' + String(i + 1).padStart(2, '0') + '</span><span>' + esc(ch.title) + '</span></a>';
          }).join('')
        : '<div class="empty">لا توجد فصول بعد…</div>') +
    '</div>';
}

/* ⭐ إصلاح: بناء الستايل عبر كائن بدلاً من split على سلسلة CSS (كان هشًا ومكسِّرًا عند غياب الخاصية) */
function chapterStyleObj(ch, def){
  var s = Object.assign({}, def || {}, ch.style || {});
  return {
    font: s.font,
    fontSize: s.fontSize || 20,
    color: s.color,
    lineHeight: s.lineHeight || 2.1,
    headingFont: s.headingFont,
    headingSize: s.headingSize || 28,
    headingColor: s.headingColor
  };
}
function chapterStyleAttrs(ch, def){
  var s = chapterStyleObj(ch, def);
  return ''+
    'font-family:' + esc(s.font) + ',serif;'+
    'font-size:' + s.fontSize + 'px;'+
    'color:' + esc(s.color) + ';'+
    'line-height:' + s.lineHeight + ';'+
    '--hfont:' + esc(s.headingFont) + ',serif;'+
    '--hsize:' + s.headingSize + 'px;'+
    '--hcolor:' + esc(s.headingColor) + ';';
}
function chapterHeadStyleAttrs(ch, def){
  var s = chapterStyleObj(ch, def);
  return 'font-family:' + esc(s.headingFont) + ',serif;font-size:' + s.headingSize + 'px;color:' + esc(s.headingColor) + ';';
}

function renderChapter(id){
  var b = CONTENT.book;
  var ch = b.chapters.find(function(x){ return x.id === id; });
  if (!ch){ app.innerHTML = '<a href="#/book" class="back-link">→ فصول الكتاب</a><div class="empty">الفصل غير موجود</div>'; return; }

  /* إذا كان مغلقًا → شاشة الإغلاق في صفحة التفاصيل فقط */
  if (ch.locked === true){ app.innerHTML = lockedScreen('chapter'); return; }

  var css = chapterStyleAttrs(ch, b.defaultStyle);
  var headStyle = chapterHeadStyleAttrs(ch, b.defaultStyle);

  var rich = isRichHtml(ch.content);
  var bodyHtml = rich ? sanitizeHtml(ch.content) : esc(ch.content).replace(/\n/g,'<br>');
  var bodyClass = rich ? 'chapter-content' : 'chapter-content is-plain';

  app.innerHTML =
    '<a href="#/book" class="back-link">→ فصول الكتاب</a>'+
    '<h2 class="page-title" style="' + headStyle + '">' + esc(ch.title) + '</h2>'+
    '<div class="' + bodyClass + '" style="' + css + '">' + bodyHtml + '</div>'+
    youtubeEmbed(ch.youtubeUrl);

  /* ⭐ بعد إدراج المحتوى: استبدل كل مرجع قصيدة (data-poem-id) بنص القصيدة الكامل من المكتبة */
  expandPoemRefs();
}

/* يستبدل جميع عناصر .poem-ref داخل الصفحة الحالية بنص القصيدة الكامل من قسم القصائد */
function expandPoemRefs(){
  var refs = document.querySelectorAll('.poem-ref[data-poem-id]');
  refs.forEach(function(el){
    var pid = el.getAttribute('data-poem-id');
    var p = (CONTENT.poems || []).find(function(x){ return x.id === pid; });
    if(!p || p.locked === true){
      el.outerHTML = '<div class="poem-display" style="opacity:.55"><div class="pd-body"><em>القصيدة غير متاحة حاليًا</em></div></div>';
      return;
    }
    var poemStyle = poemStyleStr(p) + 'margin:24px 0';
    var headStyle = poemHeadStyleStr(p);
    var html = '<div class="poem-display" style="' + poemStyle + '">'+
      '<h2 class="pd-title" style="' + headStyle + '">' + esc(p.title) + '</h2>'+
      (p.reason && p.reason.trim() ? '<div class="pd-reason">' + esc(p.reason) + '</div>' : '')+
      '<div class="pd-body">' + poemBodyInnerHTML(p) + '</div>'+
    '</div>';
    el.outerHTML = html;
  });
}

function renderPoems(){
  var ps = CONTENT.poems;
  app.innerHTML =
    '<a href="#/home" class="back-link">→ الرئيسية</a>'+
    '<h2 class="page-title">القصائد</h2>'+
    '<div class="subtitle">من دفتر بائعة الأحلام</div>'+
    (ps.length
      ? ps.map(function(p){
          return '<a class="poem-item" href="#/poem/' + p.id + '"><span class="p-title">' + esc(p.title) + '</span></a>';
        }).join('')
      : '<div class="empty">لا توجد قصائد بعد…</div>');
}

function poemStyleStr(p){
  var s = p.style || {};
  return ''+
    'font-family:' + esc(s.font || 'Amiri') + ',serif;'+
    'font-size:' + (s.fontSize || 22) + 'px;'+
    'color:' + esc(s.color || '#33302E') + ';'+
    'line-height:' + (s.lineHeight || 2.2) + ';';
}
function poemHeadStyleStr(p){
  var s = p.style || {};
  return 'font-family:' + esc(s.headingFont || 'Aref Ruqaa') + ',serif;font-size:' + (s.headingSize || 30) + 'px;color:' + esc(s.headingColor || '#8B1A1A') + ';';
}

/* ⭐ دالة موحّدة لمحتوى القصيدة — تُستخدم في صفحة القصائد وداخل بلوك القصيدة في الفصل */
function poemBodyInnerHTML(p){
  if (p.type === 'vertical' && Array.isArray(p.lines) && p.lines.length){
    return p.lines.map(function(l){
      return '<div class="bayt">'+
        '<span class="b-a">' + esc(l.a || '') + '</span>'+
        (l.sep ? '<span class="b-sep">' + esc(l.sep) + '</span>' : '<span class="b-sep"></span>')+
        '<span class="b-b">' + esc(l.b || '') + '</span>'+
      '</div>';
    }).join('');
  }
  return esc(p.content || '');
}

function renderPoem(id){
  var p = CONTENT.poems.find(function(x){ return x.id === id; });
  if (!p){ app.innerHTML = '<a href="#/poems" class="back-link">→ القصائد</a><div class="empty">القصيدة غير موجودة</div>'; return; }
  if (p.locked === true){ app.innerHTML = lockedScreen('poem'); return; }

  var bodyHtml = poemBodyInnerHTML(p);

  app.innerHTML =
    '<a href="#/poems" class="back-link">→ القصائد</a>'+
    '<div class="poem-display" style="' + poemStyleStr(p) + '">'+
      '<h2 class="pd-title" style="' + poemHeadStyleStr(p) + '">' + esc(p.title) + '</h2>'+
      (p.reason && p.reason.trim() ? '<div class="pd-reason">' + esc(p.reason) + '</div>' : '')+
      '<div class="pd-body">' + bodyHtml + '</div>'+
    '</div>';
}

function renderExcerpts(){
  var es = (CONTENT.excerpts || []).filter(function(e){ return e.hidden !== true; });
  app.innerHTML =
    '<a href="#/home" class="back-link">→ الرئيسية</a>'+
    '<h2 class="page-title">مقتطفات شعرية</h2>'+
    '<div class="subtitle">خواطر تهمس بها الكلمات</div>'+
    (es.length ? es.map(function(e){
      var s = e.style || {};
      var textStyle = 'font-family:' + esc(s.font || 'Scheherazade New') + ',serif;font-size:' + (s.fontSize || 20) + 'px;color:' + esc(s.color || '#4A4036') + ';line-height:' + (s.lineHeight || 2);
      var titleStyle = e.title ? 'font-family:' + esc(s.headingFont || 'Aref Ruqaa') + ',serif;font-size:' + (s.headingSize || 26) + 'px;color:' + esc(s.headingColor || '#8B1A1A') : '';
      return '<div class="excerpt-card">' + (e.title ? '<div class="e-title" style="' + titleStyle + '">' + esc(e.title) + '</div>' : '') + '<div class="e-text" style="' + textStyle + '">' + sanitizeHtml(e.text || '') + '</div></div>';
    }).join('') : '<div class="empty">لا توجد مقتطفات بعد…</div>');
}

function aboutSectionHTML(){
  var a = CONTENT.about;
  var style = 'font-family:' + esc(a.font) + ',sans-serif;font-size:' + (a.fontSize || 18) + 'px;color:' + esc(a.color) + ';line-height:' + (a.lineHeight || 2);
  return '<section class="page" style="margin-top:30px">'+
    '<h2 class="page-title">عن الكاتب</h2>'+
    '<div class="subtitle">بائعة الأحلام</div>'+
    '<div class="about-body" style="' + style + '">' + esc(a.text) + '</div>'+
  '</section>';
}
function renderAbout(){
  var a = CONTENT.about;
  var style = 'font-family:' + esc(a.font) + ',sans-serif;font-size:' + (a.fontSize || 18) + 'px;color:' + esc(a.color) + ';line-height:' + (a.lineHeight || 2);
  app.innerHTML =
    '<a href="#/home" class="back-link">→ الرئيسية</a>'+
    '<h2 class="page-title">عن الكاتب</h2>'+
    '<div class="subtitle">بائعة الأحلام</div>'+
    '<div class="about-body" style="' + style + '">' + esc(a.text) + '</div>';
}

function contactFormHTML(){
  return '<form class="contact-form" id="contactForm" autocomplete="off">'+
    '<label class="f-label" for="cMsg">الرسالة</label>'+
    '<textarea id="cMsg" placeholder="اكتب رسالتك هنا…" required></textarea>'+
    '<button type="submit" class="btn-primary" id="cSend">إرسال الرسالة</button>'+
  '</form>';
}
function contactSectionHTML(){
  return '<section class="page">'+
    '<h2 class="page-title">تواصل</h2>'+
    '<div class="subtitle">أرسل الرسالة لمشتري الأحلام</div>'+
    contactFormHTML()+
  '</section>';
}
function bindContactForm(){
  var form = document.getElementById('contactForm');
  if (!form || form._bound) return;
  form._bound = true;
  form.addEventListener('submit', async function(e){
    e.preventDefault();
    var btn = document.getElementById('cSend');
    if (!btn) return;
    btn.disabled = true; btn.textContent = 'جاري الإرسال…';
    try{
      var r = await fetch('/api/messages', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ name: document.getElementById('cName').value, message: document.getElementById('cMsg').value }) });
      var j = await r.json();
      if (j.ok){ form.reset(); showToast('تم إرسال رسالتك إلى مشتري الأحلام بنجاح ✓'); }
      else showToast(j.error || 'تعذر الإرسال، حاول مجددًا');
    }catch(err){ showToast('تعذر الاتصال بالخادم'); }
    btn.disabled = false; btn.textContent = 'إرسال الرسالة';
  });
}
function renderContact(){
  app.innerHTML =
    '<a href="#/home" class="back-link">→ الرئيسية</a>'+
    '<h2 class="page-title">تواصل</h2>'+
    '<div class="subtitle">أرسل الرسالة لمشتري الأحلام</div>'+
    contactFormHTML();
  bindContactForm();
}

async function init(){
  document.getElementById('year').textContent = new Date().getFullYear();
  try{
    var r = await fetch('/api/content');
    CONTENT = await r.json();
  }catch(e){
    app.innerHTML = '<div class="empty">تعذر تحميل المحتوى من الخادم. تأكد من تشغيل server.js.</div>';
    return;
  }
  applyTheme(CONTENT.theme);
  renderSocial();
  route();
}

document.getElementById('menuBtn').addEventListener('click', function(){ document.getElementById('mainNav').classList.toggle('open'); });
window.addEventListener('hashchange', function(){ if (CONTENT) route(); });
init();
</script>
</body>
</html>
