<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بائعة الأحلام</title><link href="https://fonts.googleapis.com/css2?family=Amiri&family=Aref+Ruqaa&family=Cairo&family=Changa&family=Lemonada&family=Reem+Kufi&family=Scheherazade+New&family=Tajawal&display=swap" rel="stylesheet"><style>
:root{--primary:#8B1A1A;--gold:#C9A227;--text:#3E3A39;--bg:#FAF3E8;--card:#FFFDF8;--base-font:Tajawal,sans-serif;--heading-font:'Aref Ruqaa',serif;--base-size:17px;--heading-size:32px}*{box-sizing:border-box}body{margin:0;font-family:var(--base-font);font-size:var(--base-size);background:var(--bg);color:var(--text);line-height:1.9}a{text-decoration:none;color:inherit}.site-header{position:sticky;top:0;background:var(--card);border-bottom:2px solid var(--gold);z-index:10}.header-inner,.hero,.cards,.page{max-width:1180px;margin:auto;padding:16px 20px}.header-inner{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand,h1,h2,h3,.chapter-head{font-family:var(--heading-font);color:var(--primary)}.brand{font-size:27px;font-weight:bold}nav{display:flex;gap:4px;flex-wrap:wrap}nav a{padding:7px 12px;border-radius:20px}nav a:hover{background:#c9a22722;color:var(--primary)}.menu-btn{display:none}.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:35px;align-items:center;padding-top:48px}.hero h1{font-size:clamp(42px,6vw,65px);margin:0 0 18px}.quote,.daily,.card,.chapter-content,.poem-body,.reason{background:var(--card);border:1px solid #c9a22766;border-radius:14px;box-shadow:0 8px 28px #5028141a;padding:28px}.quote{font-size:24px}.hero-img{min-height:250px;background:#f3e6c8;border-radius:14px;display:grid;place-items:center;color:var(--gold);overflow:hidden}.hero-img img{width:100%;height:100%;object-fit:cover}.daily{max-width:900px;margin:10px auto;text-align:center}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}.cards .card{text-align:center}.page{max-width:980px}.page-title{text-align:center;font-size:var(--heading-size)}.subtitle{text-align:center;color:var(--gold)}.back{display:inline-block;margin-bottom:18px;color:var(--primary);font-weight:bold}.chapter-item,.poem-item{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card);border:1px solid #c9a22766;border-radius:12px;padding:15px 20px;margin:10px 0;font-weight:bold}.chapter-item:hover,.poem-item:hover{background:var(--primary);color:#fff8ec}.num{color:var(--gold);margin-left:10px}.type{font-size:12px;background:#c9a2272b;padding:3px 10px;border-radius:20px}.chapter-content,.poem-body{margin-top:24px}.chapter-content p{margin:0 0 16px}.chapter-content h1,.chapter-content h2,.chapter-content h3{margin:1.3em 0 .55em}.chapter-content img{max-width:100%;border-radius:10px}.chapter-content blockquote{border-right:4px solid var(--gold);padding-right:14px}.free{white-space:pre-wrap}.poem-head{text-align:center}.reason{border-right:4px solid var(--gold);margin:22px 0;box-shadow:none}.vertical-lines{display:grid;gap:14px}.bayt{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;direction:rtl}.bayt .first{text-align:right;padding-left:14px}.bayt .second{text-align:left;padding-right:14px}.bayt .sep{color:var(--gold);font-weight:bold;text-align:center;white-space:nowrap}.embedded-poem{margin:24px 0;padding:18px;background:#fffaf0;border:1px solid #c9a22766;border-radius:12px}.locked{text-align:center;padding:70px 20px;font-family:var(--heading-font);font-size:26px;color:var(--primary)}.empty{text-align:center;padding:40px;opacity:.65}footer{margin-top:40px;background:#2c1a12;color:#e9dfc9;text-align:center;padding:28px;border-top:3px solid var(--gold)}.ql-size-small{font-size:.75em}.ql-size-large{font-size:1.5em}.ql-size-huge{font-size:2.5em}.ql-font-Amiri{font-family:Amiri,serif}.ql-font-Aref-Ruqaa{font-family:'Aref Ruqaa',serif}.ql-font-Tajawal{font-family:Tajawal,sans-serif}.ql-font-Cairo{font-family:Cairo,sans-serif}.ql-font-Reem-Kufi{font-family:'Reem Kufi',sans-serif}.ql-font-Lemonada{font-family:Lemonada,sans-serif}.ql-font-Changa{font-family:Changa,sans-serif}.ql-font-Scheherazade-New{font-family:'Scheherazade New',serif}@media(max-width:900px){.hero{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.menu-btn{display:block;background:none;border:1px solid var(--primary);border-radius:8px;font-size:20px}nav{display:none;width:100%;flex-direction:column}nav.open{display:flex}nav a{text-align:center}.page{padding:20px 14px}.bayt{grid-template-columns:1fr;gap:3px;text-align:center}.bayt .first,.bayt .second{text-align:center;padding:0}.bayt .sep{order:2}.bayt .first{order:1}.bayt .second{order:3}}
</style></head><body><header class="site-header"><div class="header-inner"><a class="brand" href="#/home">بائعة الأحلام ✦</a><button id="menuBtn" class="menu-btn">☰</button><nav id="mainNav"><a href="#/home">الرئيسية</a><a href="#/book">كتاب بائعة الأحلام</a><a href="#/poems">القصائد</a><a href="#/excerpts">المقتطفات الشعرية</a><a href="#/about">عن الكاتب</a><a href="#/contact">تواصل</a><a href="/admin.html">لوحة التحكم</a></nav></div></header><main id="app"><div class="empty">جاري تحميل الموقع…</div></main><footer>© بائعة الأحلام — جميع الحقوق محفوظة <span id="year"></span></footer><script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');let CONTENT=null;function safeHtml(html){let d=new DOMParser().parseFromString(String(html||''),'text/html');d.querySelectorAll('script,iframe,object,embed,link,meta,style,form,input,button,textarea,select').forEach(n=>n.remove());d.querySelectorAll('*').forEach(n=>[...n.attributes].forEach(a=>{let k=a.name.toLowerCase(),v=(a.value||'').trim().toLowerCase();if(k.startsWith('on')||((k==='href'||k==='src'||k==='xlink:href')&&v.startsWith('javascript:')))n.removeAttribute(a.name)}));return d.body.innerHTML}function youtube(url){let m=String(url||'').match(/(?:youtube\.com\/(?:watch\?.*v=|embed\/|shorts\/|live\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/);return m?`<div class="card"><iframe style="width:100%;aspect-ratio:16/9;border:0" src="https://www.youtube.com/embed/${m[1]}" allowfullscreen></iframe></div>`:''}function theme(t){let r=document.documentElement.style;r.setProperty('--primary',t.primaryColor||'#8B1A1A');r.setProperty('--gold',t.goldColor||'#C9A227');r.setProperty('--text',t.textColor||'#3E3A39');r.setProperty('--bg',t.bgColor||'#FAF3E8');r.setProperty('--card',t.cardColor||'#FFFDF8');r.setProperty('--base-font',`'${t.baseFont||'Tajawal'}',sans-serif`);r.setProperty('--heading-font',`'${t.headingFont||'Aref Ruqaa'}',serif`);r.setProperty('--base-size',(t.baseSize||17)+'px');r.setProperty('--heading-size',(t.headingSize||32)+'px')}
function back(t='الرئيسية',h='#/home'){return `<a class="back" href="${h}">→ ${t}</a>`}function poemBody(p,embed=false){let s=p.style||'',style=`font-family:'${esc(s.font||'Amiri')}';font-size:${s.fontSize||22}px;color:${esc(s.color||'#33302E')};line-height:${s.lineHeight||2.2}`;if(p.type==='vertical')return `<div class="poem-body vertical ${embed?'embedded-poem':''}" style="${style}"><div class="vertical-lines">${(p.lines||[]).map(l=>`<div class="bayt"><span class="first">${esc(l.a||'')}</span><span class="sep">${esc(l.sep||'—')}</span><span class="second">${esc(l.b||'')}</span></div>`).join('')}</div></div>`;return `<div class="poem-body free ${embed?'embedded-poem':''}" style="${style}">${safeHtml(p.content||'')}</div>`}function locked(kind){return `<div class="locked">🔒 هذا ${kind} مغلق حاليًا.</div>`}function poemBlock(id){let p=CONTENT.poems.find(x=>x.id===id);return p?`<section class="embedded-poem"><div class="poem-head"><h3>${esc(p.title)}</h3></div>${p.locked?locked('القصيدة'):poemBody(p,true)}</section>`:''}
function renderHome(){let c=CONTENT,h=c.hero.quote,d=c.dailyExcerpt;$('#app').innerHTML=`<section class="hero"><div><h1>${esc(c.site.name)}</h1><p>${esc(c.site.tagline)}</p><div class="quote" style="font-family:'${esc(h.font)}';font-size:${h.fontSize||26}px;color:${esc(h.color)}">${esc(h.text)}</div></div><div class="hero-img">${c.hero.imageUrl?`<img src="${esc(c.hero.imageUrl)}">`:'صورة الموقع'}</div></section><div class="daily"><h3>✦ مقتطف اليوم ✦</h3><div style="font-family:'${esc(d.font)}';font-size:${d.fontSize||22}px;color:${esc(d.color)}">${esc(d.text)}</div></div><section class="cards"><a class="card" href="#/book">📖<h3>${esc(c.book.title)}</h3><p>فصول الكتاب وحكاياته</p></a><a class="card" href="#/poems">🌙<h3>القصائد</h3><p>شعر عمودي وشعر حر</p></a><a class="card" href="#/excerpts">🕊️<h3>مقتطفات شعرية</h3><p>خواطر ومقتطفات مختارة</p></a></section>`}function renderBook(){let b=CONTENT.book;$('#app').innerHTML=`<div class="page">${back()}<h2 class="page-title">${esc(b.title)}</h2><p class="subtitle">رحلة بين الفصول</p><div class="card">${esc(b.blurb.text)}</div><h3>فصول الكتاب</h3>${(b.chapters||[]).map((c,i)=>`<a class="chapter-item" href="#/chapter/${encodeURIComponent(c.id)}"><span><span class="num">${String(i+1).padStart(2,'0')}</span>${esc(c.title)}</span></a>`).join('')||'<div class="empty">لا توجد فصول بعد…</div>'}</div>`}function renderChapter(id){let c=CONTENT.book.chapters.find(x=>x.id===decodeURIComponent(id));if(!c)return $('#app').innerHTML='<div class="page"><div class="empty">الفصل غير موجود</div></div>';if(c.locked)return $('#app').innerHTML=`<div class="page">${back('فصول الكتاب','#/book')}${locked('الفصل')}</div>`;let html=safeHtml(c.content||'');html=html.replace(/\[\[POEM:([^\]]+)\]\]/g,(_,x)=>poemBlock(x));$('#app').innerHTML=`<div class="page">${back('فصول الكتاب','#/book')}<h2 class="chapter-head">${esc(c.title)}</h2><article class="chapter-content">${html}</article>${youtube(c.youtubeUrl)}</div>`}function renderPoems(){let ps=CONTENT.poems;$('#app').innerHTML=`<div class="page">${back()}<h2 class="page-title">القصائد</h2><p class="subtitle">من دفتر بائعة الأحلام</p>${ps.map(p=>`<a class="poem-item" href="#/poem/${encodeURIComponent(p.id)}"><span>${esc(p.title)}</span><span class="type">${p.type==='free'?'شعر حر / تفعيلة':'شعر عمودي'}</span></a>`).join('')||'<div class="empty">لا توجد قصائد بعد…</div>'}</div>`}function renderPoem(id){let p=CONTENT.poems.find(x=>x.id===decodeURIComponent(id));if(!p)return $('#app').innerHTML='<div class="page"><div class="empty">القصيدة غير موجودة</div></div>';$('#app').innerHTML=`<div class="page">${back('القصائد','#/poems')}<div class="poem-head"><h2 class="page-title">${esc(p.title)}</h2><span class="type">${p.type==='free'?'شعر حر / تفعيلة':'شعر عمودي'}</span></div>${p.locked?locked('القصيدة'):`${p.reason?`<div class="reason">${esc(p.reason)}</div>`:''}${poemBody(p)}`}</div>`}function renderExcerpts(){let es=CONTENT.excerpts;$('#app').innerHTML=`<div class="page">${back()}<h2 class="page-title">مقتطفات شعرية</h2><p class="subtitle">خواطر تهمس بها الكلمات</p>${es.map(e=>`<div class="card"><h3>${esc(e.title||'')}</h3><div>${safeHtml(e.text||'')}</div></div>`).join('')||'<div class="empty">لا توجد مقتطفات بعد…</div>'}</div>`}function renderAbout(){let a=CONTENT.about;$('#app').innerHTML=`<div class="page">${back()}<h2 class="page-title">عن الكاتب</h2><div class="card">${esc(a.text)}</div></div>`}function renderContact(){$('#app').innerHTML=`<div class="page">${back()}<h2 class="page-title">تواصل</h2><div class="card"><form id="contactForm"><label>الاسم</label><input id="name" style="width:100%;padding:10px"><label>الرسالة</label><textarea id="message" required style="width:100%;min-height:150px;padding:10px"></textarea><button style="margin-top:12px;padding:10px 25px">إرسال الرسالة</button></form></div></div>`;$('#contactForm').onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('#name').value,message:$('#message').value})});alert(r.ok?'تم إرسال الرسالة بنجاح':'تعذر الإرسال')}}function route(){let p=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean),r=p[0]||'home';({home:renderHome,book:renderBook,chapter:()=>renderChapter(p[1]),poems:renderPoems,poem:()=>renderPoem(p[1]),excerpts:renderExcerpts,about:renderAbout,contact:renderContact}[r]||renderHome)();$('#mainNav').classList.remove('open');scrollTo(0,0)}$('#menuBtn').onclick=()=>$('#mainNav').classList.toggle('open');addEventListener('hashchange',route);$('#year').textContent=new Date().getFullYear();fetch('/api/content').then(r=>r.json()).then(c=>{CONTENT=c;theme(c.theme||{});route()}).catch(()=>$('#app').innerHTML='<div class="empty">تعذر تحميل المحتوى من الخادم.</div>');
</script></body></html>
