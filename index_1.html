<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>بائعة الأحلام</title>
<meta name="description" content="بائعة الأحلام — موقع أدبي للشعر والمقتطفات والكتاب" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@300;400;500;700&family=Cairo:wght@300;400;600;700&family=Reem+Kufi:wght@400;600&family=Lemonada:wght@300;400;600&family=Changa:wght@300;400;600&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet" />
<style>
:root{
  --primary:#8B1A1A;
  --gold:#C9A227;
  --text:#3E3A39;
  --bg:#FAF3E8;
  --card:#FFFDF8;
  --base-font:'Tajawal',sans-serif;
  --heading-font:'Aref Ruqaa',serif;
  --base-size:17px;
  --heading-size:32px;
  --radius:14px;
  --shadow:0 8px 28px rgba(80,40,20,.10);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--base-font);background:var(--bg);color:var(--text);font-size:var(--base-size);line-height:1.9;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
button{cursor:pointer;font-family:inherit}
.hidden{display:none!important}

/* ---------- الشريط العلوي ---------- */
header.site-header{position:sticky;top:0;z-index:100;background:var(--card);border-bottom:2px solid var(--gold);box-shadow:0 2px 12px rgba(80,40,20,.07)}
.header-inner{max-width:1180px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{font-family:var(--heading-font);font-size:26px;color:var(--primary);font-weight:700;display:flex;align-items:center;gap:8px}
.brand .dot{color:var(--gold);font-size:20px}
nav.main-nav{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
nav.main-nav a{padding:8px 13px;border-radius:30px;font-weight:500;font-size:15.5px;color:var(--text);transition:.25s}
nav.main-nav a:hover{background:rgba(201,162,39,.14);color:var(--primary)}
nav.main-nav a.admin-link{background:var(--primary);color:#FFF8EC;border-radius:30px}
nav.main-nav a.admin-link:hover{background:#6f1414}
.menu-btn{display:none;background:none;border:1.5px solid var(--primary);color:var(--primary);border-radius:10px;padding:6px 12px;font-size:20px;line-height:1}

/* ---------- الهيرو ---------- */
.hero{max-width:1180px;margin:0 auto;padding:56px 20px 30px;display:grid;grid-template-columns:1.15fr .85fr;gap:44px;align-items:center}
.hero-text h1{font-family:var(--heading-font);color:var(--primary);font-size:clamp(40px,6vw,64px);line-height:1.35;margin-bottom:24px}
.hero-text .tagline{color:var(--text);font-size:clamp(17px,2.3vw,21px);line-height:2;border-right:4px solid var(--gold);padding-right:16px;margin-bottom:46px}
.quote-box{background:var(--card);border:1px solid rgba(201,162,39,.5);border-radius:var(--radius);padding:50px 30px 30px;box-shadow:var(--shadow);position:relative}
.quote-box::before{content:'❝';position:absolute;top:-20px;right:24px;font-size:60px;color:var(--gold);font-family:serif}
.quote-box .quote-text{white-space:pre-wrap}
.hero-img{border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;border:1px solid rgba(201,162,39,.4)}
.hero-img img{width:100%;height:100%;max-height:430px;object-fit:cover}
.hero-img .img-empty{height:320px;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#fdf6e7,#f3e6c8);color:var(--gold);font-family:var(--heading-font);font-size:22px;text-align:center;padding:20px}

/* ---------- مقتطف اليوم ---------- */
.daily{max-width:980px;margin:10px auto 0;padding:0 20px}
.daily-card{background:linear-gradient(145deg,var(--card),#fbf1dd);border:1px solid rgba(201,162,39,.45);border-radius:var(--radius);padding:34px 38px;text-align:center;box-shadow:var(--shadow);position:relative}
.daily-card h3{font-family:var(--heading-font);color:var(--gold);font-size:22px;margin-bottom:14px;letter-spacing:.5px}
.daily-card .daily-text{white-space:pre-wrap}

/* ---------- البطاقات الرئيسية ---------- */
.cards{max-width:1180px;margin:0 auto;padding:56px 20px 20px;display:grid;grid-template-columns:repeat(3,1fr);gap:26px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:36px 26px;text-align:center;border:1px solid rgba(201,162,39,.35);transition:transform .3s,box-shadow .3s;display:flex;flex-direction:column;gap:8px}
.card:hover{transform:translateY(-6px);box-shadow:0 16px 40px rgba(80,40,20,.16)}
.card .icon{font-size:44px}
.card h3{font-family:var(--heading-font);color:var(--primary);font-size:24px}
.card p{color:var(--text);opacity:.85;font-size:15.5px}

/* ---------- عناوين الصفحات الداخلية ---------- */
.page{max-width:980px;margin:0 auto;padding:44px 20px;width:100%}
.page h2.page-title{font-family:var(--heading-font);color:var(--primary);font-size:var(--heading-size);text-align:center;margin-bottom:10px}
.page .subtitle{text-align:center;color:var(--gold);font-weight:500;margin-bottom:34px}
.back-link{display:inline-block;margin-bottom:24px;color:var(--primary);font-weight:700;border-bottom:2px solid var(--gold);padding-bottom:2px}
.back-link:hover{opacity:.75}

/* ---------- الكتاب ---------- */
.blurb-box{background:var(--card);border:1px solid rgba(201,162,39,.45);border-radius:var(--radius);box-shadow:var(--shadow);padding:30px 34px;margin-bottom:34px;white-space:pre-wrap}
.chapters h3{font-family:var(--heading-font);color:var(--primary);font-size:24px;margin-bottom:18px}
.chapter-item{display:block;background:var(--card);border:1px solid rgba(201,162,39,.4);border-radius:12px;padding:16px 22px;margin-bottom:12px;box-shadow:0 3px 10px rgba(80,40,20,.06);transition:.25s;font-size:18px;font-weight:600;color:var(--text)}
.chapter-item:hover{background:var(--primary);color:#FFF8EC;transform:translateX(4px)}
.chapter-item .num{color:var(--gold);font-family:var(--heading-font);margin-left:10px}
.chapter-item:hover .num{color:#ffe9a8}
.chapter-content{background:var(--card);border:1px solid rgba(201,162,39,.4);border-radius:var(--radius);box-shadow:var(--shadow);padding:38px 42px}
.chapter-content.is-plain{white-space:pre-wrap}
.chapter-content p{margin:0 0 16px}
.chapter-content p:last-child{margin-bottom:0}
.chapter-content h1,.chapter-content h2,.chapter-content h3{font-family:var(--hfont,'Aref Ruqaa'),serif;color:var(--hcolor,#8B1A1A);margin:1.3em 0 .55em;line-height:1.4}
.chapter-content h1{font-size:calc(var(--hsize,28px)*1.2)}
.chapter-content h2{font-size:var(--hsize,28px)}
.chapter-content h3{font-size:calc(var(--hsize,28px)*.85)}
.chapter-content ul,.chapter-content ol{margin:0 0 16px;padding-right:1.9em}
.chapter-content li{margin-bottom:6px}
.chapter-content blockquote{border-right:4px solid var(--gold);padding-right:14px;margin:0 0 16px;font-style:italic}
.chapter-content img{max-width:100%;border-radius:10px;margin:8px 0}
.chapter-content a{color:var(--primary);border-bottom:1px solid var(--gold)}
.chapter-content .ql-code-block,.chapter-content pre.ql-syntax{background:#f5efe0;direction:ltr;text-align:left;font-family:monospace;padding:14px;border-radius:8px;margin:0 0 16px;white-space:pre-wrap}
/* تنسيقات محرر Quill المحفوظة مع نص الفصل */
.chapter-content .ql-align-center{text-align:center}
.chapter-content .ql-align-right{text-align:right}
.chapter-content .ql-align-left{text-align:left}
.chapter-content .ql-align-justify{text-align:justify}
.chapter-content .ql-direction-rtl{direction:rtl;text-align:right}
.chapter-content .ql-direction-ltr{direction:ltr;text-align:left}
.chapter-content .ql-indent-1{margin-right:2.2em}
.chapter-content .ql-indent-2{margin-right:4.4em}
.chapter-content .ql-indent-3{margin-right:6.6em}
.chapter-content .ql-indent-4{margin-right:8.8em}
.chapter-content .ql-indent-5{margin-right:11em}
.chapter-content .ql-indent-6{margin-right:13.2em}
.chapter-content .ql-indent-7{margin-right:15.4em}
.chapter-content .ql-indent-8{margin-right:17.6em}
.chapter-content .ql-indent-9{margin-right:19.8em}
.chapter-content .ql-size-small{font-size:.75em}
.chapter-content .ql-size-large{font-size:1.5em}
.chapter-content .ql-size-huge{font-size:2.5em}
.chapter-content .ql-super{font-size:75%;vertical-align:super}
.chapter-content .ql-sub{font-size:75%;vertical-align:sub}
.chapter-head{text-align:center;font-family:var(--heading-font);color:var(--primary);font-size:30px;margin-bottom:30px}
.video-wrap{position:relative;width:100%;aspect-ratio:16/9;margin-top:32px;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);border:1px solid rgba(201,162,39,.4)}
.video-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

/* ---------- القصائد ---------- */
.poem-item{background:var(--card);border:1px solid rgba(201,162,39,.4);border-radius:12px;padding:16px 22px;margin-bottom:12px;box-shadow:0 3px 10px rgba(80,40,20,.06);transition:.25s;display:flex;justify-content:space-between;align-items:center;gap:12px}
.poem-item:hover{background:var(--primary);color:#FFF8EC;transform:translateX(4px)}
.poem-item .p-title{font-weight:700;font-size:18px}
.poem-item .p-type{font-size:12.5px;background:rgba(201,162,39,.16);color:#8a6d1c;border-radius:30px;padding:3px 12px;white-space:nowrap}
.poem-item:hover .p-type{background:rgba(255,255,255,.18);color:#ffe9a8}
.poem-head{text-align:center;margin-bottom:8px}
.poem-head h2{font-family:var(--heading-font);color:var(--primary)}
.poem-type-badge{display:inline-block;margin-top:6px;background:rgba(201,162,39,.18);color:#8a6d1c;border-radius:30px;padding:4px 16px;font-size:13.5px}
.poem-reason{background:var(--card);border-right:4px solid var(--gold);border-radius:10px;padding:18px 24px;margin:26px 0;box-shadow:0 3px 12px rgba(80,40,20,.07);white-space:pre-wrap}
.poem-body{background:var(--card);border:1px solid rgba(201,162,39,.4);border-radius:var(--radius);box-shadow:var(--shadow);padding:40px 34px;white-space:pre-wrap;text-align:center}
.poem-body.vertical{text-align:center}
.poem-body.free{text-align:right;line-height:2.3}
.poem-body.vertical .bayt{display:flex;justify-content:center;align-items:center;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.bayt .b-sep{color:var(--gold);font-weight:700}

/* ---------- المقتطفات ---------- */
.excerpt-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:30px 34px;margin-bottom:22px;border:1px solid rgba(201,162,39,.35)}
.excerpt-card .e-title{font-family:var(--heading-font);color:var(--primary);font-size:23px;margin-bottom:12px}
.excerpt-card .e-text{white-space:pre-wrap;color:var(--text)}

/* ---------- عن الكاتب ---------- */
.about-body{background:var(--card);border:1px solid rgba(201,162,39,.45);border-radius:var(--radius);box-shadow:var(--shadow);padding:38px 42px;white-space:pre-wrap}

/* ---------- التواصل ---------- */
.contact-form{background:var(--card);border:1px solid rgba(201,162,39,.45);border-radius:var(--radius);box-shadow:var(--shadow);padding:38px 42px;max-width:640px;margin:0 auto}
.contact-form .f-label{display:block;margin-bottom:8px;font-weight:700;color:var(--primary)}
.contact-form input,.contact-form textarea{width:100%;border:1.5px solid #e8dcc0;border-radius:10px;padding:13px 16px;font-family:inherit;font-size:16px;background:#fffdf8;margin-bottom:18px;outline:none;transition:.25s}
.contact-form input:focus,.contact-form textarea:focus{border-color:var(--primary)}
.contact-form textarea{min-height:150px;resize:vertical}
.btn-primary{background:var(--primary);color:#FFF8EC;border:none;border-radius:30px;padding:13px 36px;font-size:17px;font-weight:700;transition:.25s}
.btn-primary:hover{background:#6f1414;transform:translateY(-2px)}
.btn-primary:disabled{opacity:.6;cursor:not-allowed}

/* ---------- الفوتر ---------- */
footer.site-footer{margin-top:auto;background:#2c1a12;color:#e9dfc9;text-align:center;padding:34px 20px 26px;border-top:3px solid var(--gold)}
.social-row{display:flex;justify-content:center;gap:16px;margin-bottom:18px}
.social-row a{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.09);display:flex;align-items:center;justify-content:center;transition:.25s;border:1px solid rgba(201,162,39,.35)}
.social-row a:hover{background:var(--gold);color:#2c1a12;transform:translateY(-3px)}
.social-row .svg{width:20px;height:20px;fill:currentColor}
.copy{font-size:14.5px;opacity:.85}

/* ---------- حالات ---------- */
.loader{text-align:center;padding:80px 20px;color:var(--gold);font-family:var(--heading-font);font-size:22px}
.empty{text-align:center;padding:40px 20px;color:var(--text);opacity:.65;font-size:17px}
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--primary);color:#FFF8EC;padding:14px 30px;border-radius:40px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:300;transition:.35s;font-weight:500;max-width:90vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}

/* ---------- تجاوب ---------- */
@media(max-width:900px){
  .hero{grid-template-columns:1fr;padding-top:36px}
  .cards{grid-template-columns:1fr;padding-top:40px}
  .menu-btn{display:block}
  nav.main-nav{display:none;width:100%;flex-direction:column;align-items:stretch;padding-top:10px}
  nav.main-nav.open{display:flex}
  nav.main-nav a{text-align:center}
  .chapter-content,.about-body,.contact-form,.poem-body{padding:26px 20px}
}
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="#/" class="brand">بائعة الأحلام <span class="dot">✦</span></a>
    <button class="menu-btn" id="menuBtn" aria-label="القائمة">☰</button>
    <nav class="main-nav" id="mainNav">
      <a href="#/">الرئيسية</a>
      <a href="#/book">كتاب بائعة الأحلام</a>
      <a href="#/poems">القصائد</a>
      <a href="#/excerpts">المقتطفات الشعرية</a>
      <a href="#/about">عن الكاتب</a>
      <a href="#/contact">تواصل</a>
      <a href="/admin.html" class="admin-link">لوحة التحكم</a>
    </nav>
  </div>
</header>

<main id="app" dir="rtl">
  <div class="loader">جاري تحميل الموقع…</div>
</main>

<footer class="site-footer">
  <div class="social-row" id="socialRow"></div>
  <div class="copy">© بائعة الأحلام — جميع الحقوق محفوظة <span id="year"></span></div>
</footer>

<div id="toast"></div>

<script>
/* ================= الأمان: تهريب النصوص ================= */
function esc(s){
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
/* تنظيف HTML القادم من محرر Quill: يسمح بالتنسيق ويحذف أي كود خطير */
function sanitizeHtml(html){
  const doc=new DOMParser().parseFromString(String(html||''),'text/html');
  doc.querySelectorAll('script,iframe,object,embed,link,meta,style,form,input,button,textarea,select').forEach(n=>n.remove());
  doc.querySelectorAll('*').forEach(n=>{
    [...n.attributes].forEach(a=>{
      const name=a.name.toLowerCase();
      if(name.startsWith('on')){n.removeAttribute(a.name);return;}
      const v=(a.value||'').trim().toLowerCase();
      if((name==='href'||name==='src'||name==='xlink:href')&&v.startsWith('javascript:')){n.removeAttribute(a.name);}
    });
  });
  return doc.body.innerHTML;
}
/* هل المحتوى نص عادي (فصول قديمة) أم HTML منسق؟ */
function isRichHtml(content){
  return /<[a-z][\s\S]*>/i.test(String(content||''));
}
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2600);
}

/* ================= تحويل روابط يوتيوب ================= */
function youtubeEmbed(url){
  if(!url || !String(url).trim()) return '';
  const m=String(url).match(/(?:youtube\.com\/(?:watch\?.*v=|embed\/|shorts\/|live\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/);
  if(!m) return '';
  return '<div class="video-wrap"><iframe src="https://www.youtube.com/embed/'+esc(m[1])+'" title="فيديو" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>';
}

/* ================= الحالة العامة ================= */
let CONTENT=null;
const app=document.getElementById('app');
const FONTS=["Amiri","Aref Ruqaa","Tajawal","Cairo","Reem Kufi","Lemonada","Changa","Scheherazade New"];
const $=s=>document.querySelector(s);

function applyTheme(t){
  const r=document.documentElement.style;
  r.setProperty('--primary',t.primaryColor);
  r.setProperty('--gold',t.goldColor);
  r.setProperty('--text',t.textColor);
  r.setProperty('--bg',t.bgColor);
  r.setProperty('--card',t.cardColor);
  r.setProperty('--base-font',`'${t.baseFont}',sans-serif`);
  r.setProperty('--heading-font',`'${t.headingFont}',serif`);
  r.setProperty('--base-size',(t.baseSize||17)+'px');
  r.setProperty('--heading-size',(t.headingSize||32)+'px');
}

/* ================= أيقونات التواصل ================= */
const SOCIAL_ICONS={
  youtube:'<svg class="svg" viewBox="0 0 24 24"><path d="M23 7.6a3 3 0 0 0-2.1-2.2C19 4.9 12 4.9 12 4.9s-7 0-8.9.5A3 3 0 0 0 1 7.6 31 31 0 0 0 .5 12 31 31 0 0 0 1 16.4a3 3 0 0 0 2.1 2.1c1.9.6 8.9.6 8.9.6s7 0 8.9-.6a3 3 0 0 0 2.1-2.1A31 31 0 0 0 23.5 12 31 31 0 0 0 23 7.6zM9.6 15.4V8.6l6 3.4z"/></svg>',
  instagram:'<svg class="svg" viewBox="0 0 24 24"><path d="M12 2.2c3.2 0 3.6 0 4.9.1 3.3.1 4.8 1.7 4.9 4.9.1 1.3.1 1.6.1 4.8s0 3.6-.1 4.8c-.1 3.2-1.7 4.8-4.9 4.9-1.3.1-1.6.1-4.9.1s-3.6 0-4.8-.1c-3.3-.1-4.8-1.7-4.9-4.9-.1-1.3-.1-1.6-.1-4.8s0-3.6.1-4.8C2.4 4 4 2.4 7.2 2.3 8.4 2.2 8.8 2.2 12 2.2zm0 3.7a6.1 6.1 0 1 0 0 12.2 6.1 6.1 0 0 0 0-12.2zm0 2.2a3.9 3.9 0 1 1 0 7.8 3.9 3.9 0 0 1 0-7.8zm6.2-3.8a1.4 1.4 0 1 0 0 2.8 1.4 1.4 0 0 0 0-2.8z"/></svg>',
  facebook:'<svg class="svg" viewBox="0 0 24 24"><path d="M22 12a10 10 0 1 0-11.6 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.5h-1.3c-1.2 0-1.6.8-1.6 1.6V12h2.8l-.4 2.9h-2.4v7A10 10 0 0 0 22 12z"/></svg>',
  tiktok:'<svg class="svg" viewBox="0 0 448 512"><path d="M448,209.91a210.06,210.06,0,0,1-122.77-39.25V349.38A162.55,162.55,0,1,1,185,188.31V278.2a74.62,74.62,0,1,0,52.23,71.18V0l88,0a121.18,121.18,0,0,0,1.86,22.17h0A122.18,122.18,0,0,0,381,102.39a121.43,121.43,0,0,0,67,20.14Z"/></svg>'
};

function renderSocial(){
  const row=document.getElementById('socialRow');
  const s=(CONTENT&&CONTENT.social)||{};
  const links=[['youtube',s.youtube],['instagram',s.instagram],['facebook',s.facebook],['tiktok',s.tiktok]];
  row.innerHTML=links.map(([k,u])=>u?'<a href="'+esc(u)+'" target="_blank" rel="noopener" title="'+k+'">'+SOCIAL_ICONS[k]+'</a>':'').join('');
}

/* ================= الموجّه ================= */
function parseHash(){
  const h=location.hash.replace(/^#\/?/,'');
  const parts=h.split('/').filter(Boolean);
  return {route:parts[0]||'home',id:parts[1]||null};
}
function go(href){location.hash=href;}

function route(){
  const {route,id}=parseHash();
  if(route==='home') renderHome();
  else if(route==='book') renderBook();
  else if(route==='chapter'&&id) renderChapter(id);
  else if(route==='poems') renderPoems();
  else if(route==='poem'&&id) renderPoem(id);
  else if(route==='excerpts') renderExcerpts();
  else if(route==='about') renderAbout();
  else if(route==='contact') renderContact();
  else renderHome();
  document.getElementById('mainNav').classList.remove('open');
  window.scrollTo({top:0,behavior:'instant'});
}

/* ================= الصفحة الرئيسية ================= */
function renderHome(){
  const c=CONTENT,hero=c.hero,daily=c.dailyExcerpt;

  const img=hero.imageUrl&&hero.imageUrl.trim()
    ?'<img src="'+esc(hero.imageUrl)+'" alt="صورة الموقع">'
    :'<div class="img-empty">صورة الموقع<br>— من لوحة التحكم —</div>';
  app.innerHTML=
  '<section class="hero">'+
    '<div class="hero-text">'+
      '<h1>'+esc(c.site.name)+'</h1>'+
      '<p class="tagline">'+esc(c.site.tagline)+'</p>'+
      '<div class="quote-box"><div class="quote-text" style="'+quoteStyle+'">'+esc(hero.quote.text)+'</div></div>'+
    '</div>'+
    '<div class="hero-img">'+img+'</div>'+
  '</section>'+
  '<section class="daily">'+
    '<div class="daily-card">'+
      '<h3>✦ مقتطف اليوم ✦</h3>'+
      '<div class="daily-text" style="font-family:\''+esc(daily.font)+'\',serif;font-size:'+(daily.fontSize||22)+'px;color:'+esc(daily.color)+';line-height:'+(daily.lineHeight||2)+'">'+esc(daily.text)+'</div>'+
    '</div>'+
  '</section>'+
  '<section class="cards">'+
    '<a class="card" href="#/book"><div class="icon">📖</div><h3>'+esc(c.book.title)+'</h3><p>فصول الكتاب وحكاياته</p></a>'+
    '<a class="card" href="#/poems"><div class="icon">🌙</div><h3>القصائد</h3><p>شعر عمودي وشعر حر</p></a>'+
    '<a class="card" href="#/excerpts"><div class="icon">🕊️</div><h3>مقتطفات شعرية</h3><p>خواطر ومقتطفات مختارة</p></a>'+
  '</section>'+
  aboutSectionHTML()+
  contactSectionHTML();
  bindContactForm();
}

/* ================= صفحة الكتاب ================= */
function renderBook(){
  const b=CONTENT.book;
  const blurb=b.blurb;
  app.innerHTML=
  '<div class="page">'+
    '<a class="back-link" href="#/">→ الرئيسية</a>'+
    '<h2 class="page-title">'+esc(b.title)+'</h2>'+
    '<div class="subtitle">رحلة بين الفصول</div>'+
    '<div class="blurb-box" style="font-family:\''+esc(blurb.font)+'\',serif;font-size:'+(blurb.fontSize||18)+'px;color:'+esc(blurb.color)+';line-height:'+(blurb.lineHeight||1.9)+'">'+esc(blurb.text)+'</div>'+
    '<div class="chapters"><h3>فصول الكتاب</h3>'+
      (b.chapters.length?b.chapters.map((ch,i)=>'<a class="chapter-item" href="#/chapter/'+esc(ch.id)+'"><span class="num">'+String(i+1).padStart(2,'0')+'</span>'+esc(ch.title)+'</a>').join(''):'<div class="empty">لا توجد فصول بعد…</div>')+
    '</div>'+
  '</div>';
}

function chapterStyle(ch,def){
  const s=Object.assign({},def||{},ch.style||{});
  return 'font-family:\''+esc(s.font)+'\',serif;font-size:'+(s.fontSize||20)+'px;color:'+esc(s.color)+';line-height:'+(s.lineHeight||2.1)+';--hfont:\''+esc(s.headingFont)+'\',serif;--hsize:'+(s.headingSize||28)+'px;--hcolor:'+esc(s.headingColor)+';';
}

function renderChapter(id){
  const b=CONTENT.book;
  const ch=b.chapters.find(x=>x.id===id);
  if(!ch){app.innerHTML='<div class="page"><div class="empty">الفصل غير موجود</div><a class="back-link" href="#/book">العودة للكتاب</a></div>';return;}
  const css=chapterStyle(ch,b.defaultStyle);
  const headStyle='font-family:'+css.split('--hfont:')[1].split(';')[0]+';font-size:'+css.split('--hsize:')[1].split(';')[0]+';color:'+css.split('--hcolor:')[1].split(';')[0];
  // محتوى الفصل: إن كان HTML منسق من محرر Quill نعرضه كما هو (بعد تنظيفه)،
  // وإن كان نصًا عاديًا (فصول قديمة) نعرضه كنص مع الحفاظ على الأسطر
  const rich=isRichHtml(ch.content);
  const bodyHtml=rich ? sanitizeHtml(ch.content) : esc(ch.content);
  const bodyClass=rich ? 'chapter-content' : 'chapter-content is-plain';
  app.innerHTML=
  '<div class="page">'+
    '<a class="back-link" href="#/book">→ فصول الكتاب</a>'+
    '<h2 class="chapter-head" style="'+headStyle+'">'+esc(ch.title)+'</h2>'+
    '<div class="'+bodyClass+'" style="'+css+'">'+bodyHtml+'</div>'+
    youtubeEmbed(ch.youtubeUrl)+
  '</div>';
}

/* ================= القصائد ================= */
function renderPoems(){
  const ps=CONTENT.poems;
  app.innerHTML=
  '<div class="page">'+
    '<a class="back-link" href="#/">→ الرئيسية</a>'+
    '<h2 class="page-title">القصائد</h2>'+
    '<div class="subtitle">من دفتر بائعة الأحلام</div>'+
    (ps.length?ps.map(p=>'<a class="poem-item" href="#/poem/'+esc(p.id)+'"><span class="p-title">'+esc(p.title)+'</span></a>').join(''):'<div class="empty">لا توجد قصائد بعد…</div>')+
  '</div>';
}

function poemStyle(p){
  const s=p.style||{};
  return 'font-family:\''+esc(s.font||'Amiri')+'\',serif;font-size:'+(s.fontSize||22)+'px;color:'+esc(s.color||'#33302E')+';line-height:'+(s.lineHeight||2.2);
}
function poemHeadStyle(p){
  const s=p.style||{};
  return 'font-family:\''+esc(s.headingFont||'Aref Ruqaa')+'\',serif;font-size:'+(s.headingSize||30)+'px;color:'+esc(s.headingColor||'#8B1A1A');
}

function poemBodyHTML(p){
  if(p.type==='vertical'&&Array.isArray(p.lines)&&p.lines.length){
    return '<div class="poem-body vertical" style="'+poemStyle(p)+'">'+
      p.lines.map(l=>'<div class="bayt"><span class="b-a">'+esc(l.a||'')+'</span>'+(l.sep?'<span class="b-sep">'+esc(l.sep)+'</span>':'')+'<span class="b-b">'+esc(l.b||'')+'</span></div>').join('')+
    '</div>';
  }
  return '<div class="poem-body '+(p.type==='free'?'free':'vertical')+'" style="'+poemStyle(p)+'">'+esc(p.content)+'</div>';
}

function renderPoem(id){
  const p=CONTENT.poems.find(x=>x.id===id);
  if(!p){app.innerHTML='<div class="page"><div class="empty">القصيدة غير موجودة</div><a class="back-link" href="#/poems">العودة للقصائد</a></div>';return;}
  app.innerHTML=
  '<div class="page">'+
    '<a class="back-link" href="#/poems">→ القصائد</a>'+
    '<div class="poem-head"><h2 style="'+poemHeadStyle(p)+'">'+esc(p.title)+'</h2>'+
    '<span class="poem-type-badge">'+(p.type==='free'?'شعر حر / تفعيلة':'شعر عمودي')+'</span></div>'+
    (p.reason&&p.reason.trim()?'<div class="poem-reason" style="font-family:\''+esc((p.style&&p.style.font)||'Tajawal')+'\',sans-serif;font-size:15.5px;color:#6b5848">'+esc(p.reason)+'</div>':'')+
    poemBodyHTML(p)+
  '</div>';
}

/* ================= عن الكاتب (قسم في الرئيسية + صفحة مستقلة) ================= */
function aboutSectionHTML(){
  const a=CONTENT.about;
  return '<section class="page" id="homeAbout">'+
    '<h2 class="page-title">عن الكاتب</h2>'+
    '<div class="subtitle">بائعة الأحلام</div>'+
    '<div class="about-body" style="font-family:\''+esc(a.font)+'\',sans-serif;font-size:'+(a.fontSize||18)+'px;color:'+esc(a.color)+';line-height:'+(a.lineHeight||2)+'">'+esc(a.text)+'</div>'+

/* ================= تواصل ================= */
function contactFormHTML(){
  return '<form class="contact-form" id="contactForm">'+
    '<label class="f-label">الرسالة</label>'+
    '<textarea id="cMsg" required placeholder="اكتب رسالتك هنا…" maxlength="4000" rows="6"></textarea>'+
    '<button type="submit" class="btn-primary" id="cSend">إرسال الرسالة</button>'+
  '</form>';
}
function contactSectionHTML(){
  return '<section class="page" id="homeContact">'+
    '<h2 class="page-title">تواصل</h2>'+
    '<div class="subtitle">أرسل الرسالة لمشتري الأحلام</div>'+
    contactFormHTML()+
  '</section>';
}
function bindContactForm(){
  const form=document.getElementById('contactForm');
  if(!form||form._bound)return;
  form._bound=true;
  form.addEventListener('submit',async(e)=>{
    e.preventDefault();
    const btn=document.getElementById('cSend');
    if(!btn)return;
    btn.disabled=true;btn.textContent='جاري الإرسال…';
    try{
      const r=await fetch('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:document.getElementById('cMsg').value})});
      const j=await r.json();
      if(j.ok){form.reset();showToast('تم إرسال رسالتك إلى مشتري الأحلام بنجاح ✓');}
      else showToast(j.error||'تعذر الإرسال، حاول مجددًا');
    }catch(err){showToast('تعذر الاتصال بالخادم');}
    btn.disabled=false;btn.textContent='إرسال الرسالة';
  });
}
function renderContact(){
  app.innerHTML=
  '<div class="page">'+
    '<a class="back-link" href="#/">→ الرئيسية</a>'+
    '<h2 class="page-title">تواصل</h2>'+
    '<div class="subtitle">أرسل الرسالة لمشتري الأحلام</div>'+
    contactFormHTML()+
  '</div>';
  bindContactForm();
}

/* ================= التحميل ================= */
async function init(){
  document.getElementById('year').textContent=new Date().getFullYear();
  try{
    const r=await fetch('/api/content');
    CONTENT=await r.json();
  }catch(e){
    app.innerHTML='<div class="empty">تعذر تحميل المحتوى من الخادم. تأكد من تشغيل server.js.</div>';
    return;
  }
  applyTheme(CONTENT.theme);
  renderSocial();
  route();
}

document.getElementById('menuBtn').addEventListener('click',()=>document.getElementById('mainNav').classList.toggle('open'));
window.addEventListener('hashchange',()=>{if(CONTENT)route();});
init();
</script>
