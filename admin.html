<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>لوحة التحكم — بائعة الأحلام</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@300;400;500;700&family=Cairo:wght@300;400;600;700&family=Reem+Kufi:wght@400;600&family=Lemonada:wght@300;400;600&family=Changa:wght@300;400;600&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet" />

<!-- إضافة مكتبة Quill.js لمحرر النصوص المتقدم -->
<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>

<style>
:root{--primary:#8B1A1A;--gold:#C9A227;--text:#3E3A39;--bg:#F7EFE0;--card:#FFFDF8;--base-font:'Tajawal',sans-serif;--heading-font:'Aref Ruqaa',serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--base-font);background:var(--bg);color:var(--text);line-height:1.8}
button{cursor:pointer;font-family:inherit}
input,select,textarea{font-family:inherit}
.hidden{display:none!important}

/* شاشة الدخول */
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:var(--card);border:1px solid rgba(201,162,39,.5);border-radius:16px;box-shadow:0 12px 40px rgba(80,40,20,.14);padding:44px 38px;width:100%;max-width:400px;text-align:center}
.login-box h1{font-family:var(--heading-font);color:var(--primary);font-size:30px;margin-bottom:6px}
.login-box p{color:var(--gold);margin-bottom:24px}
.login-box input{width:100%;border:1.5px solid #e8dcc0;border-radius:10px;padding:13px 16px;font-size:16px;margin-bottom:14px;outline:none;background:#fffdf8}
.login-box input:focus{border-color:var(--primary)}
.login-box button{width:100%;background:var(--primary);color:#FFF8EC;border:none;border-radius:30px;padding:13px;font-size:17px;font-weight:700}
.login-box .err{color:#b31212;font-size:14px;min-height:20px;margin-bottom:6px}

/* الهيكل بعد الدخول */
#panel{min-height:100vh;display:flex;flex-direction:column}
.topbar{background:#2c1a12;color:#e9dfc9;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;border-bottom:3px solid var(--gold);position:sticky;top:0;z-index:50}
.topbar .t-title{font-family:var(--heading-font);font-size:22px;color:#ffe9a8}
.topbar .t-left{display:flex;align-items:center;gap:14px}
.badge{background:var(--gold);color:#2c1a12;border-radius:30px;padding:3px 14px;font-weight:700;font-size:14px}
.topbar button{background:rgba(255,255,255,.1);color:#e9dfc9;border:1px solid rgba(201,162,39,.4);border-radius:30px;padding:7px 18px;font-size:14.5px}
.topbar button:hover{background:rgba(201,162,39,.25)}

.body-wrap{display:flex;flex:1}
.tabs{width:210px;background:var(--card);border-left:1px solid #e8dcc0;padding:16px 10px;display:flex;flex-direction:column;gap:4px}
.tabs button{background:none;border:none;border-radius:10px;padding:11px 14px;font-size:15px;font-weight:600;text-align:right;color:var(--text);transition:.2s}
.tabs button:hover{background:rgba(139,26,26,.07);color:var(--primary)}
.tabs button.active{background:var(--primary);color:#FFF8EC}
.tab-content{flex:1;padding:28px 30px;max-width:1000px;overflow-x:auto}

/* المكونات */
h2.sec-title{font-family:var(--heading-font);color:var(--primary);font-size:26px;margin-bottom:4px}
p.sec-sub{color:var(--gold);margin-bottom:22px;font-size:14.5px}
.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:14px}
.field label{display:block;font-size:13.5px;font-weight:700;color:var(--primary);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;border:1.5px solid #e8dcc0;border-radius:9px;padding:10px 13px;font-size:15px;background:#fffdf8;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary)}
.field textarea{resize:vertical;min-height:90px}
.field input[type=color]{height:44px;padding:4px;cursor:pointer}

/* تنسيق محرر النصوص المتقدم */
.ql-container { font-size: 16px; font-family: 'Tajawal', sans-serif; min-height: 250px; background: #fffdf8; border-bottom-left-radius: 9px; border-bottom-right-radius: 9px; }
.ql-toolbar { background: #fbf6ea; border-top-left-radius: 9px; border-top-right-radius: 9px; border-color: #e8dcc0 !important; }
.ql-container { border-color: #e8dcc0 !important; }

.cp-row{margin-bottom:10px;background:#fbf6ea;border:1px solid #e8dcc0;border-radius:10px;padding:10px}
.cp-grid{display:grid;grid-template-columns:1fr 64px 1fr auto;gap:8px;align-items:center}
@media(max-width:640px){.cp-grid{grid-template-columns:1fr 70px 1fr}}
.cp-grid input{border:1.5px solid #e8dcc0;border-radius:8px;padding:9px 12px;font-size:15px;background:#fffdf8;outline:none;font-family:inherit}
.cp-grid input:focus{border-color:var(--primary)}
.card{background:var(--card);border:1px solid rgba(201,162,39,.4);border-radius:14px;padding:22px 24px;margin-bottom:22px;box-shadow:0 4px 14px rgba(80,40,20,.06)}
.card h3{font-family:var(--heading-font);color:var(--primary);font-size:20px;margin-bottom:14px}
.btn{background:var(--primary);color:#FFF8EC;border:none;border-radius:30px;padding:10px 26px;font-size:15px;font-weight:700;transition:.2s}
.btn:hover{background:#6f1414}
.btn.gold{background:var(--gold);color:#2c1a12}
.btn.gray{background:#e9e0cd;color:#5c4f3e}
.btn.red{background:#a32626;color:#fff}
.btn.small{padding:6px 14px;font-size:13.5px;border-radius:20px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;justify-content:flex-start}

/* قوائم العناصر */
.item-list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--card);border:1px solid #e8dcc0;border-radius:12px;padding:13px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.item .it-main{display:flex;align-items:center;gap:12px;flex:1;min-width:180px}
.item .it-title{font-weight:700;font-size:16px}
.item .it-tag{font-size:12px;background:rgba(201,162,39,.16);color:#8a6d1c;border-radius:30px;padding:2px 10px}
.item .it-actions{display:flex;gap:6px}
.move-btn{background:none;border:1px solid #d8cbaa;border-radius:8px;padding:4px 10px;font-size:14px;color:#6b5848}
.move-btn:hover{background:rgba(201,162,39,.15)}
.move-btn:disabled{opacity:.35;cursor:not-allowed}

/* الرسائل */
.msg-item{background:var(--card);border:1px solid #e8dcc0;border-radius:12px;padding:16px 20px;margin-bottom:12px}
.msg-item.unread{border-color:var(--gold);background:#fffaf0;box-shadow:0 3px 12px rgba(201,162,39,.18)}
.msg-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.msg-head .who{font-weight:700;color:var(--primary)}
.msg-head .when{font-size:13px;color:#8a8578}
.msg-head .state{font-size:12px;border-radius:30px;padding:2px 12px}
.msg-head .state.new{background:var(--gold);color:#2c1a12}
.msg-head .state.read{background:#e9e0cd;color:#6b5848}
.msg-body{white-space:pre-wrap;background:#fbf6ea;border-radius:8px;padding:12px 16px;margin-bottom:10px;font-size:15px}
.msg-actions{display:flex;gap:8px}

/* الإشعارات */
#notifBar{display:none;background:#fdf3d7;border:1px solid var(--gold);color:#7a5f14;border-radius:10px;padding:12px 18px;margin-bottom:18px;font-weight:700}
#notifBar.show{display:flex;align-items:center;gap:10px}

/* توست */
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(130px);background:var(--primary);color:#FFF8EC;padding:13px 30px;border-radius:40px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:300;transition:.35s;font-weight:500}
#toast.show{transform:translateX(-50%) translateY(0)}

@media(max-width:820px){
  .body-wrap{flex-direction:column}
  .tabs{width:100%;flex-direction:row;flex-wrap:wrap;border-left:none;border-bottom:1px solid #e8dcc0;padding:10px}
  .tabs button{flex:1;min-width:130px;text-align:center;font-size:14px}
  .tab-content{padding:20px 16px}
  .topbar .t-title{font-size:18px}
}
</style>
</head>
<body>

<!-- شاشة الدخول -->
<div id="loginScreen">
  <div class="login-box">
    <h1>بائعة الأحلام</h1>
    <p>لوحة التحكم</p>
    <div class="err" id="loginErr"></div>
    <input type="password" id="pwdInput" placeholder="كلمة المرور" autocomplete="current-password">
    <button id="loginBtn">دخول</button>
  </div>
</div>

<!-- اللوحة -->
<div id="panel" class="hidden">
  <div class="topbar">
    <div class="t-title">✦ لوحة التحكم — بائعة الأحلام</div>
    <div class="t-left">
      <span class="badge hidden" id="msgBadge">🔔 رسائل جديدة</span>
      <a href="/" target="_blank"><button>عرض الموقع</button></a>
      <button id="logoutBtn">تسجيل الخروج</button>
    </div>
  </div>

  <div class="body-wrap">
    <nav class="tabs" id="tabs">
      <button data-tab="home" class="active">الرئيسية</button>
      <button data-tab="book">الكتاب</button>
      <button data-tab="poems">القصائد</button>
      <button data-tab="excerpts">المقتطفات الشعرية</button>
      <button data-tab="about">عن الكاتب</button>
      <button data-tab="contact">التواصل</button>
      <button data-tab="social">روابط التواصل</button>
      <button data-tab="theme">التخصيص البصري</button>
    </nav>

    <main class="tab-content" id="tabContent"></main>
  </div>
</div>

<div id="toast"></div>

<script>
/* ================= أساسيات ================= */
const $=s=>document.querySelector(s);
const FONTS=["Amiri","Aref Ruqaa","Tajawal","Cairo","Reem Kufi","Lemonada","Changa","Scheherazade New"];
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
let CONTENT=null, MESSAGES=[], TOKEN=localStorage.getItem('admin_token')||'';
let quillEditor = null; // متغير محرر النصوص

function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2400);}
function uid(){return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function authHeaders(extra){const h=Object.assign({'Content-Type':'application/json'},extra||{});if(TOKEN)h['Authorization']='Bearer '+TOKEN;return h;}
async function api(path,opt){
  const r=await fetch(path,Object.assign({},opt,{headers:authHeaders(opt&&opt.headers)}));
  const j=await r.json().catch(()=>({}));
  if(r.status===401&&path!=='/api/messages'&&!path.includes('/api/login')){toast('انتهت الجلسة، سجّل الدخول مجددًا');showLogin();throw new Error('unauth');}
  return {status:r.status,body:j};
}
function fontOptions(sel,name){
  return '<select id="'+esc(sel)+'"><option value="">— اختر —</option>'+FONTS.map(f=>'<option value="'+f+'"'+(f===name?' selected':'')+'>'+f+'</option>').join('')+'</select>';
}

/* ================= الجلسة ================= */
async function checkAuth(){
  const {body}=await api('/api/me');
  if(body.authenticated){TOKEN=localStorage.getItem('admin_token')||'';enterPanel();}
  else showLogin();
}
function showLogin(){$('#loginScreen').classList.remove('hidden');$('#panel').classList.add('hidden');}
function enterPanel(){$('#loginScreen').classList.add('hidden');$('#panel').classList.remove('hidden');loadAll();}

$('#loginBtn').addEventListener('click',doLogin);
$('#pwdInput').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
async function doLogin(){
  const pwd=$('#pwdInput').value;
  $('#loginErr').textContent='';
  const {status,body}=await api('/api/login',{method:'POST',body:JSON.stringify({password:pwd})});
  if(body.ok){TOKEN=localStorage.getItem('admin_token')||'';enterPanel();}
  else if(status===429)$('#loginErr').textContent=body.error||'حاول لاحقًا';
  else $('#loginErr').textContent='كلمة المرور غير صحيحة';
}
$('#logoutBtn').addEventListener('click',async()=>{await api('/api/logout',{method:'POST'});localStorage.removeItem('admin_token');TOKEN='';showLogin();});
checkAuth();

/* ================= تحميل البيانات ================= */
async function loadAll(){
  try{
    const c=await api('/api/content');CONTENT=c.body;
    await loadMessages();
    switchTab('home');
  }catch(e){toast('تعذر تحميل البيانات');}
}
async function loadMessages(){
  const {body}=await api('/api/messages');
  MESSAGES=body.messages||[];
  const unread=body.unread||0;
  $('#msgBadge').classList.toggle('hidden',unread===0);
  $('#msgBadge').textContent='🔔 رسالة جديدة من أحد زوار الموقع'+(unread>1?' ('+unread+')':'');
}
async function saveContent(){
  const {status,body}=await api('/api/content',{method:'PUT',body:JSON.stringify(CONTENT)});
  if(body.ok)toast('تم الحفظ بنجاح ✓');
  else toast(body.error||'خطأ في الحفظ');
}

/* ================= التبويبات ================= */
$('#tabs').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  switchTab(b.dataset.tab);
});
function switchTab(tab){
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  const fns={home:tabHome,book:tabBook,poems:tabPoems,excerpts:tabExcerpts,about:tabAbout,contact:tabContact,social:tabSocial,theme:tabTheme};
  (fns[tab]||tabHome)();
}

/* ================= تبويب الرئيسية ================= */
function tabHome(){
  const h=CONTENT.hero,d=CONTENT.dailyExcerpt;
  $('#tabContent').innerHTML=
  '<h2 class="sec-title">الرئيسية</h2><p class="sec-sub">الاقتباس الرئيسي والصورة ومقتطف اليوم</p>'+
  '<div class="card"><h3>العبارة الأدبية الرئيسية</h3>'+
    '<div class="field" style="margin-bottom:12px"><label>العبارة</label><input id="hTagline" value="'+esc(CONTENT.site.tagline)+'"></div>'+
    '<div class="form-row">'+
      '<div class="field"><label>الخط</label>'+fontOptions('hQuoteFont',h.quote.font)+'</div>'+
      '<div class="field"><label>حجم الخط</label><input type="number" id="hQuoteSize" min="12" max="60" value="'+(h.quote.fontSize||26)+'"></div>'+
      '<div class="field"><label>لون النص</label><input type="color" id="hQuoteColor" value="'+esc(h.quote.color)+'"></div>'+
      '<div class="field"><label>تباعد الأسطر</label><input type="number" id="hQuoteLH" min="1" max="4" step="0.1" value="'+(h.quote.lineHeight||2)+'"></div>'+
    '</div>'+
    '<div class="field" style="margin-bottom:12px"><label>الاقتباس الرئيسي (النص)</label><textarea id="hQuoteText">'+esc(h.quote.text)+'</textarea></div>'+
    '<div class="field"><label>رابط الصورة الرئيسية</label><input id="hImg" placeholder="https://..." value="'+esc(h.imageUrl)+'"></div>'+
    '<div class="row-actions"><button class="btn" onclick="saveHome()">حفظ تغييرات الرئيسية</button></div>'+
  '</div>'+
  '<div class="card"><h3>مقتطف اليوم</h3>'+
    '<div class="field" style="margin-bottom:12px"><label>نص المقتطف</label><textarea id="dText">'+esc(d.text)+'</textarea></div>'+
    '<div class="form-row">'+
      '<div class="field"><label>الخط</label>'+fontOptions('dFont',d.font)+'</div>'+
      '<div class="field"><label>حجم الخط</label><input type="number" id="dSize" min="12" max="60" value="'+(d.fontSize||22)+'"></div>'+
      '<div class="field"><label>لون النص</label><input type="color" id="dColor" value="'+esc(d.color)+'"></div>'+
      '<div class="field"><label>تباعد الأسطر</label><input type="number" id="dLH" min="1" max="4" step="0.1" value="'+(d.lineHeight||2)+'"></div>'+
    '</div>'+
    '<div class="row-actions"><button class="btn" onclick="saveDaily()">حفظ مقتطف اليوم</button></div>'+
  '</div>';
}
function saveHome(){
  CONTENT.site.tagline=$('#hTagline').value;
  CONTENT.hero.quote.font=$('#hQuoteFont').value||CONTENT.hero.quote.font;
  CONTENT.hero.quote.fontSize=+$('#hQuoteSize').value;
  CONTENT.hero.quote.color=$('#hQuoteColor').value;
  CONTENT.hero.quote.lineHeight=+$('#hQuoteLH').value;
  CONTENT.hero.quote.text=$('#hQuoteText').value;
  CONTENT.hero.imageUrl=$('#hImg').value.trim();
  saveContent();
}
function saveDaily(){
  CONTENT.dailyExcerpt.text=$('#dText').value;
  CONTENT.dailyExcerpt.font=$('#dFont').value||CONTENT.dailyExcerpt.font;
  CONTENT.dailyExcerpt.fontSize=+$('#dSize').value;
  CONTENT.dailyExcerpt.color=$('#dColor').value;
  CONTENT.dailyExcerpt.lineHeight=+$('#dLH').value;
  saveContent();
}

/* ================= تبويب الكتاب ================= */
function tabBook(){
  const b=CONTENT.book,bl=b.blurb,ds=b.defaultStyle;
  $('#tabContent').innerHTML=
  '<h2 class="sec-title">الكتاب</h2><p class="sec-sub">اسم الكتاب والنبذة والفصول وتنسيق النص</p>'+
  '<div class="card"><h3>بيانات الكتاب</h3>'+
    '<div class="form-row">'+
      '<div class="field"><label>اسم الكتاب</label><input id="bTitle" value="'+esc(b.title)+'"></div>'+
    '</div>'+
    '<div class="field" style="margin-bottom:12px"><label>نبذة مختصرة عن الكتاب</label><textarea id="bBlurb">'+esc(bl.text)+'</textarea></div>'+
    '<div class="form-row">'+
      '<div class="field"><label>خط النبذة</label>'+fontOptions('bBlurbFont',bl.font)+'</div>'+
      '<div class="field"><label>حجم النبذة</label><input type="number" id="bBlurbSize" min="12" max="40" value="'+(bl.fontSize||18)+'"></div>'+
      '<div class="field"><label>لون النبذة</label><input type="color" id="bBlurbColor" value="'+esc(bl.color)+'"></div>'+
      '<div class="field"><label>تباعد النبذة</label><input type="number" id="bBlurbLH" min="1" max="4" step="0.1" value="'+(bl.lineHeight||1.9)+'"></div>'+
    '</div>'+
    '<div class="row-actions"><button class="btn" onclick="saveBookMeta()">حفظ بيانات الكتاب</button></div>'+
  '</div>'+
  '<div class="card"><h3>تنسيق نص الكتاب الافتراضي</h3><p style="font-size:13.5px;color:#8a8578;margin-bottom:12px">يُطبق على كل الفصول، ويمكن لكل فصل تخصيص تنسيقه الخاص</p>'+
    '<div class="form-row">'+
      '<div class="field"><label>خط النص</label>'+fontOptions('stFont',ds.font)+'</div>'+
      '<div class="field"><label>حجم النص</label><input type="number" id="stSize" min="12" max="50" value="'+(ds.fontSize||20)+'"></div>'+
      '<div class="field"><label>لون النص</label><input type="color" id="stColor" value="'+esc(ds.color)+'"></div>'+
      '<div class="field"><label>خط العناوين</label>'+fontOptions('stHeadFont',ds.headingFont)+'</div>'+
      '<div class="field"><label>حجم العناوين</label><input type="number" id="stHeadSize" min="14" max="60" value="'+(ds.headingSize||28)+'"></div>'+
      '<div class="field"><label>لون العناوين</label><input type="color" id="stHeadColor" value="'+esc(ds.headingColor)+'"></div>'+
      '<div class="field"><label>تباعد الأسطر</label><input type="number" id="stLH" min="1" max="4" step="0.1" value="'+(ds.lineHeight||2.1)+'"></div>'+
    '</div>'+
    '<div class="row-actions"><button class="btn" onclick="saveBookStyle()">حفظ تنسيق الكتاب</button></div>'+
  '</div>'+
  '<div class="card"><h3>فصول الكتاب</h3>'+
    '<div class="item-list" id="chaptersList">'+renderChapters()+'</div>'+
    '<div class="row-actions"><button class="btn gold" onclick="newChapter()">+ إضافة فصل جديد</button></div>'+
  '</div>'+
  '<div class="card hidden" id="chapterEditor"><h3 id="chEditTitle">تعديل الفصل</h3>'+
    '<div class="field" style="margin-bottom:12px"><label>عنوان الفصل</label><input id="chTitle"></div>'+
    '<div class="field" style="margin-bottom:12px"><label>نص الفصل (يمكنك التنسيق، التلوين، التوسيع، والمحاذاة لأي جزء)</label><div id="editor-container"></div></div>'+
    '<div class="field" style="margin-bottom:12px"><label>رابط فيديو YouTube (اختياري)</label><input id="chYt" placeholder="https://www.youtube.com/watch?v=..."></div>'+
    '<h3 style="font-size:16px;margin:10px 0">تنسيق عام إضافي لهذا الفصل (اختياري)</h3>'+
    '<div class="form-row">'+
      '<div class="field"><label>خط النص العام</label>'+fontOptions('chFont','')+'</div>'+

// دالة تهيئة محرر النصوص المتقدم Quill
function initQuillEditor(initialContent = '') {
  if (quillEditor) {
    quillEditor.root.innerHTML = initialContent;
    return;
  }
  quillEditor = new Quill('#editor-container', {
    theme: 'snow',
    modules: {
      toolbar: [
        [{ 'header': [1, 2, 3, false] }],
        ['bold', 'italic', 'underline', 'strike'],
        [{ 'color': [] }, { 'background': [] }],
        [{ 'align': [] }],
        [{ 'list': 'ordered'}, { 'list': 'bullet' }],
        ['clean']
      ]
    }
  });
  quillEditor.root.innerHTML = initialContent;
}

function renderChapters(){
  return CONTENT.book.chapters.map((ch,i)=>'<div class="item">'+
    '<div class="it-main"><span class="it-title">'+esc(ch.title)+'</span>'+(ch.youtubeUrl?'<span class="it-tag">🎬 فيديو</span>':'')+'</div>'+
    '<div class="it-actions">'+
      '<button class="move-btn" onclick="moveChapter('+i+',-1)" '+(i===0?'disabled':'')+'>▲</button>'+
      '<button class="move-btn" onclick="moveChapter('+i+',1)" '+(i===CONTENT.book.chapters.length-1?'disabled':'')+'>▼</button>'+
      '<button class="btn small gray" onclick="editChapter(\''+ch.id+'\')">تعديل</button>'+
      '<button class="btn small red" onclick="delChapter(\''+ch.id+'\')">حذف</button>'+
    '</div></div>').join('')||'<div class="empty" style="color:#8a8578">لا توجد فصول</div>';
}
function moveChapter(i,dir){
  const arr=CONTENT.book.chapters,j=i+dir;
  if(j<0||j>=arr.length)return;
  [arr[i],arr[j]]=[arr[j],arr[i]];
  $('#chaptersList').innerHTML=renderChapters();
}
function newChapter(){
  editingChapterId=null;
  $('#chapterEditor').classList.remove('hidden');
  $('#chEditTitle').textContent='إضافة فصل جديد';
  $('#chTitle').value='';
  initQuillEditor(''); // فتح محرر فارغ
  $('#chYt').value='';
  ['chFont','chSize','chColor','chHeadFont','chHeadSize','chHeadColor','chLH'].forEach(id=>{const el=$('#'+id);el.value=id==='chColor'?'#33302E':(id==='chHeadColor'?'#8B1A1A':'');});
  document.getElementById('chSaveBtn').textContent='إضافة الفصل';
  $('#chapterEditor').scrollIntoView({behavior:'smooth'});
}
function editChapter(id){
  const ch=CONTENT.book.chapters.find(x=>x.id===id);if(!ch)return;
  editingChapterId=id;
  const s=ch.style||{};
  $('#chapterEditor').classList.remove('hidden');
  $('#chEditTitle').textContent='تعديل: '+ch.title;
  $('#chTitle').value=ch.title;
  
  // تحميل المحتوى المنسق داخل محرر النصوص
  initQuillEditor(ch.content || ''); 

  $('#chYt').value=ch.youtubeUrl||'';
  $('#chFont').value=s.font||'';$('#chSize').value=s.fontSize||'';
  $('#chColor').value=s.color||'#33302E';
  $('#chHeadFont').value=s.headingFont||'';$('#chHeadSize').value=s.headingSize||'';
  $('#chHeadColor').value=s.headingColor||'#8B1A1A';$('#chLH').value=s.lineHeight||'';
  document.getElementById('chSaveBtn').textContent='حفظ التعديلات';
  $('#chapterEditor').scrollIntoView({behavior:'smooth'});
}
function saveChapter(){
  const title=$('#chTitle.value'==='' ? '#chTitle' : '#chTitle').value.trim();
  if(!title){toast('يرجى كتابة عنوان الفصل');return;}
  
  // سحب المحتوى بصيغة HTML من المحرر المتقدم
  const content = quillEditor ? quillEditor.root.innerHTML : '';

  const style={};
  if($('#chFont').value)style.font=$('#chFont').value;
  if($('#chSize').value)style.fontSize=+$('#chSize').value;
  style.color=$('#chColor').value==='#33302E'?(CONTENT.book.defaultStyle.color||'#33302E'):$('#chColor').value;
  if($('#chHeadFont').value)style.headingFont=$('#chHeadFont').value;
  if($('#chHeadSize').value)style.headingSize=+$('#chHeadSize').value;
  style.headingColor=$('#chHeadColor').value==='#8B1A1A'?(CONTENT.book.defaultStyle.headingColor||'#8B1A1A'):$('#chHeadColor').value;
  if($('#chLH').value)style.lineHeight=+$('#chLH').value;
  
  const data={title,content,youtubeUrl:$('#chYt').value.trim(),style};
  if(editingChapterId){
    const ch=CONTENT.book.chapters.find(x=>x.id===editingChapterId);
    Object.assign(ch,data);
  }else{
    data.id=uid();
    CONTENT.book.chapters.push(data);
  }
  saveContent();
  tabBook();
}
function delChapter(id){
  if(!confirm('هل أنت متأكد من حذف هذا الفصل نهائيًا؟'))return;
  CONTENT.book.chapters=CONTENT.book.chapters.filter(x=>x.id!==id);
  saveContent();tabBook();
}

}
function saveBookStyle(){

function editPoem(id){
  const p=CONTENT.poems.find(x=>x.id===id);if(!p)return;
  editingPoemId=id;
  const s=p.style||{};
  $('#pEditTitle').textContent='تعديل: '+p.title;
  $('#pTitle').value=p.title;$('#pType').value=p.type;
  $('#pReason').value=p.reason||'';$('#pContent').value=p.content||'';
  resetCouplets();
  if(Array.isArray(p.lines)&&p.lines.length){
    p.lines.forEach(l=>addCoupletRow(l.a,l.sep,l.b));
  }else if(p.type==='vertical'){
    addCoupletRow();
  }
  poemTypeChanged();
  $('#pFont').value=s.font||'';$('#pSize').value=s.fontSize||22;
  $('#pColor').value=s.color||'#33302E';
  $('#pHeadFont').value=s.headingFont||'';$('#pHeadSize').value=s.headingSize||30;
  $('#pHeadColor').value=s.headingColor||'#8B1A1A';$('#pLH').value=s.lineHeight||2.2;
  $('#pSaveBtn').textContent='حفظ التعديلات';
  $('#poemEditor').scrollIntoView({behavior:'smooth'});
}
function savePoem(){
  const title=$('#pTitle').value.trim();
  if(!title){toast('يرجى كتابة اسم القصيدة');return;}
  const style={
    font:$('#pFont').value||'Amiri',
    fontSize:+$('#pSize').value||22,
    color:$('#pColor').value,
    headingFont:$('#pHeadFont').value||'Aref Ruqaa',
    headingSize:+$('#pHeadSize').value||30,
    headingColor:$('#pHeadColor').value,
    lineHeight:+$('#pLH').value||2.2
  };
  const type=$('#pType').value;
  let content='',lines=[];
  if(type==='vertical'){
    document.querySelectorAll('#coupletsBox .cp-row').forEach(r=>{
      const a=r.querySelector('.cp-a').value.trim();
      const b=r.querySelector('.cp-b').value.trim();
      const sep=r.querySelector('.cp-sep').value.trim();
      if(a||b)lines.push({a,sep,b});
    });
    if(!lines.length){toast('يرجى إدخال أبيات القصيدة');return;}
  }else{
    content=$('#pContent').value;
    if(!content.trim()){toast('يرجى كتابة نص القصيدة');return;}
  }
  const data={title,type,reason:$('#pReason').value,content,lines,style};
  if(editingPoemId){
    const p=CONTENT.poems.find(x=>x.id===editingPoemId);
    Object.assign(p,data);
  }else{
    data.id=uid();
    CONTENT.poems.push(data);
  }
  saveContent();tabPoems();
}
function delPoem(id){
  if(!confirm('هل أنت متأكد من حذف هذه القصيدة نهائيًا؟'))return;
  CONTENT.poems=CONTENT.poems.filter(x=>x.id!==id);
  saveContent();tabPoems();
}

/* ================= تبويب التواصل ================= */
function tabContact(){
  const html='<h2 class="sec-title">التواصل</h2><p class="sec-sub">رسائل الزوار</p>';
  const unread=MESSAGES.filter(m=>!m.read).length;
  const notif='<div id="notifBar" class="'+(unread?'show':'')+'">🔔 رسالة جديدة من أحد زوار الموقع'+(unread>1?' ('+unread+' رسائل)':'')+'</div>';
  const list=MESSAGES.length?MESSAGES.map(m=>{
    const st=m.read?'<span class="state read">مقروءة</span>':'<span class="state new">غير مقروءة</span>';
    return '<div class="msg-item '+(m.read?'':'unread')+'" id="msg-'+m.id+'">'+
      '<div class="msg-head"><span class="who">💬 '+esc(m.name)+'</span><span class="when">'+new Date(m.createdAt).toLocaleString('ar-EG')+'</span>'+st+'</div>'+
      '<div class="msg-body">'+esc(m.message)+'</div>'+
      '<div class="msg-actions">'+
        (m.read?'':'<button class="btn small gold" onclick="markRead(\''+m.id+'\')">وضع كمقروءة</button>')+
        '<button class="btn small red" onclick="delMsg(\''+m.id+'\')">حذف الرسالة</button>'+
      '</div></div>';
  }).join(''):'<div class="empty">لا توجد رسائل بعد</div>';
  $('#tabContent').innerHTML=html+notif+'<div class="card"><h3>صندوق الرسائل</h3>'+list+'</div>';
}
async function markRead(id){
  await api('/api/messages/'+id,{method:'PATCH'});
  await loadMessages();tabContact();toast('تم تحديدها كمقروءة');
}
async function delMsg(id){
  if(!confirm('هل أنت متأكد من حذف هذه الرسالة نهائيًا؟'))return;
  await api('/api/messages/'+id,{method:'DELETE'});
  await loadMessages();tabContact();toast('تم حذف الرسالة');
}

/* ================= تبويب روابط التواصل ================= */
function tabSocial(){
  const s=CONTENT.social;
  $('#tabContent').innerHTML=
  '<h2 class="sec-title">روابط التواصل الاجتماعي</h2><p class="sec-sub">تظهر الأيقونات في الفوتر</p>'+
  '<div class="card" style="max-width:560px">'+
    '<div class="field" style="margin-bottom:14px"><label>رابط YouTube</label><input id="sYt" placeholder="https://youtube.com/..." value="'+esc(s.youtube)+'"></div>'+
    '<div class="field" style="margin-bottom:14px"><label>رابط Instagram</label><input id="sIg" placeholder="https://instagram.com/..." value="'+esc(s.instagram)+'"></div>'+
    '<div class="field" style="margin-bottom:14px"><label>رابط Facebook</label><input id="sFb" placeholder="https://facebook.com/..." value="'+esc(s.facebook)+'"></div>'+
    '<div class="field" style="margin-bottom:14px"><label>رابط TikTok</label><input id="sTk" placeholder="https://tiktok.com/..." value="'+esc(s.tiktok||'')+'"></div>'+
    '<div class="row-actions"><button class="btn" onclick="saveSocial()">حفظ الروابط</button></div>'+
  '</div>';
}
function saveSocial(){
  CONTENT.social.youtube=$('#sYt').value.trim();
  CONTENT.social.instagram=$('#sIg').value.trim();
  CONTENT.social.facebook=$('#sFb').value.trim();
  CONTENT.social.tiktok=$('#sTk').value.trim();
  saveContent();
}

/* ================= تبويب التخصيص البصري ================= */
function tabTheme(){
  const t=CONTENT.theme;
  $('#tabContent').innerHTML=
  '<h2 class="sec-title">التخصيص البصري</h2><p class="sec-sub">يُطبق مباشرة على الموقع الرئيسي</p>'+
  '<div class="card" style="max-width:700px">'+
    '<div class="form-row">'+
      '<div class="field"><label>اللون الأساسي</label><input type="color" id="tPrimary" value="'+esc(t.primaryColor)+'"></div>'+
      '<div class="field"><label>اللون الذهبي</label><input type="color" id="tGold" value="'+esc(t.goldColor)+'"></div>'+
      '<div class="field"><label>لون النص</label><input type="color" id="tText" value="'+esc(t.textColor)+'"></div>'+
      '<div class="field"><label>لون الخلفية</label><input type="color" id="tBg" value="'+esc(t.bgColor)+'"></div>'+
      '<div class="field"><label>لون البطاقات</label><input type="color" id="tCard" value="'+esc(t.cardColor)+'"></div>'+
    '</div>'+
    '<div class="form-row">'+
      '<div class="field"><label>الخط الأساسي</label>'+fontOptions('tBaseFont',t.baseFont)+'</div>'+
      '<div class="field"><label>خط العناوين</label>'+fontOptions('tHeadFont',t.headingFont)+'</div>'+
      '<div class="field"><label>حجم النص العام</label><input type="number" id="tBaseSize" min="13" max="26" value="'+(t.baseSize||17)+'"></div>'+
      '<div class="field"><label>حجم العناوين</label><input type="number" id="tHeadSize" min="20" max="60" value="'+(t.headingSize||32)+'"></div>'+
    '</div>'+
    '<div class="row-actions"><button class="btn" onclick="saveTheme()">حفظ التصميم</button></div>'+
  '</div>';
}
function saveTheme(){
  CONTENT.theme.primaryColor=$('#tPrimary').value;
  CONTENT.theme.goldColor=$('#tGold').value;
  CONTENT.theme.textColor=$('#tText').value;
  CONTENT.theme.bgColor=$('#tBg').value;
  CONTENT.theme.cardColor=$('#tCard').value;
  CONTENT.theme.baseFont=$('#tBaseFont').value||CONTENT.theme.baseFont;
  CONTENT.theme.headingFont=$('#tHeadFont').value||CONTENT.theme.headingFont;
  CONTENT.theme.baseSize=+$('#tBaseSize').value;
  CONTENT.theme.headingSize=+$('#tHeadSize').value;
  saveContent();
}
</script>
</body>
</html>
