<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة بائعة الأحلام</title><link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@400;700&family=Tajawal:wght@400;700&display=swap" rel="stylesheet"><style>:root{--p:#8b0000;--g:#d4af37;--bg:#faf8f5;--b:#e7dfd4}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Tajawal; color:#1c1917}.wrap{width:min(1200px,94%);margin:auto}.box{background:#fffdf9;border:1px solid var(--b);border-radius:20px;padding:22px;margin:20px 0;box-shadow:0 10px 30px #1c19170d}h1,h2,h3{font-family:'Aref Ruqaa';color:var(--p)}input,textarea,select{width:100%;padding:12px;border:1px solid var(--b);border-radius:12px;margin:6px 0 14px;font:inherit}textarea{min-height:130px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.btn{border:0;border-radius:999px;padding:11px 18px;cursor:pointer;font-weight:bold}.primary{background:var(--p);color:#fff}.outline{background:white;color:var(--p);border:1px solid var(--p)}.danger{background:#b91c1c;color:white}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button{padding:10px 15px;border:1px solid var(--b);background:white;border-radius:999px}.item{border:1px solid var(--b);border-radius:15px;padding:15px;margin:10px 0;background:white}.status{font-weight:bold;color:var(--p)}.hidden{display:none!important}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div id="login" class="box" style="max-width:500px;margin:70px auto"><h1>دخول لوحة التحكم</h1><input id="password" type="password" placeholder="كلمة المرور"><button class="btn primary" onclick="login()">دخول</button><p id="loginStatus" class="status"></p></div><div id="app" class="hidden"><div class="box"><h1>لوحة تحكم بائعة الأحلام</h1><button class="btn outline" onclick="location.href='/'">عرض الموقع</button> <button class="btn danger" onclick="logout()">تسجيل خروج</button></div><div class="tabs"><button onclick="show('home')">الرئيسية</button><button onclick="show('book')">كتاب بائعة الأحلام</button><button onclick="show('poems')">القصائد</button><button onclick="show('quotes')">المقتطفات الشعرية</button><button onclick="show('about')">عن الكاتب</button><button onclick="show('style')">الألوان والخطوط</button><button onclick="show('messages')">الرسائل 🔔</button></div><div id="home" class="box"><h2>الرئيسية</h2><label>الاقتباس الرئيسي</label><textarea id="mainQuote"></textarea><label>النص التعريفي</label><textarea id="intro"></textarea><label>رابط الصورة</label><input id="heroImage"><label>مقتطف اليوم</label><textarea id="featured"></textarea><button class="btn primary" onclick="saveHome()">حفظ</button><p id="homeStatus" class="status"></p></div><div id="book" class="box hidden"><h2>كتاب بائعة الأحلام</h2><label>نبذة مختصرة</label><textarea id="bookDesc"></textarea><label>رابط الغلاف</label><input id="cover"><h3>فصول الكتاب</h3><input type="hidden" id="chapterId"><input id="chapterTitle" placeholder="عنوان الفصل"><textarea id="chapterContent" placeholder="الصق نص الفصل هنا"></textarea><input id="chapterYoutube" placeholder="رابط يوتيوب اختياري"><button class="btn primary" onclick="saveChapter()">حفظ الفصل</button> <button class="btn outline" onclick="clearChapter()">جديد</button><div id="chapters"></div><button class="btn primary" onclick="saveBook()">حفظ بيانات الكتاب</button><p id="bookStatus" class="status"></p></div><div id="poems" class="box hidden"><h2>القصائد</h2><input type="hidden" id="poemId"><input id="poemTitle" placeholder="اسم القصيدة"><select id="poemType"><option value="عمودي">شعر عمودي</option><option value="تفعيلة">شعر حر / تفعيلة</option></select><textarea id="poemReason" placeholder="سبب أو دافع كتابة القصيدة"></textarea><textarea id="poemContent" placeholder="النص الكامل للقصيدة"></textarea><div class="grid"><div><label>الخط</label><select id="poemFont"><option>Amiri</option><option>Aref Ruqaa</option><option>Tajawal</option><option>Cairo</option></select></div><div><label>حجم النص</label><input id="poemSize" type="number" value="22"></div><div><label>لون النص</label><input id="poemColor" type="color" value="#2a2521"></div></div><button class="btn primary" onclick="savePoem()">حفظ القصيدة</button> <button class="btn outline" onclick="clearPoem()">جديدة</button><div id="poemsList"></div></div><div id="quotes" class="box hidden"><h2>المقتطفات الشعرية</h2><input type="hidden" id="quoteId"><input id="quoteTitle" placeholder="عنوان المقتطف"><textarea id="quoteText" placeholder="نص المقتطف"></textarea><div class="grid"><div><label>الخط</label><select id="quoteFont"><option>Amiri</option><option>Aref Ruqaa</option><option>Tajawal</option></select></div><div><label>حجم النص</label><input id="quoteSize" type="number" value="24"></div><div><label>لون النص</label><input id="quoteColor" type="color" value="#2a2521"></div></div><button class="btn primary" onclick="saveQuote()">حفظ المقتطف</button><div id="quotesList"></div></div><div id="about" class="box hidden"><h2>عن الكاتب</h2><textarea id="bio" style="min-height:300px"></textarea><button class="btn primary" onclick="saveAbout()">حفظ السيرة</button></div><div id="style" class="box hidden"><h2>الهوية البصرية</h2><div class="grid"><div><label>اللون الأساسي</label><input id="primary" type="color"></div><div><label>الذهبي</label><input id="gold" type="color"></div><div><label>خط العناوين</label><input id="titleFont"></div><div><label>خط النص</label><input id="bodyFont"></div><div><label>حجم العناوين</label><input id="titleSize" type="number"></div><div><label>حجم النص</label><input id="bodySize" type="number"></div></div><button class="btn primary" onclick="saveStyle()">حفظ التصميم</button></div><div id="messages" class="box hidden"><h2>رسائل القراء 🔔</h2><p>الرسائل تصل مجهولة الهوية كما طلبت.</p><div id="messagesList"></div></div></div></div><script>
let token=localStorage.getItem('adminToken')||'',data;
const $=id=>document.getElementById(id);async function api(url,opt={}){opt.headers={...(opt.headers||{}),'Content-Type':'application/json','Authorization':'Bearer '+token};let r=await fetch(url,opt);if(r.status===401){logout();throw Error('جلسة منتهية')}return r.json()}
async function login(){let r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('password').value})}),d=await r.json();$('loginStatus').textContent=d.message;if(r.ok){token=d.token;localStorage.setItem('adminToken',token);start()}}
function logout(){localStorage.removeItem('adminToken');token='';$('app').classList.add('hidden');$('login').classList.remove('hidden')}
function show(x){document.querySelectorAll('#app>div[id]').forEach(e=>e.classList.add('hidden'));$(x).classList.remove('hidden')}
async function start(){$('login').classList.add('hidden');$('app').classList.remove('hidden');data=await (await fetch('/api/content')).json();fill();messages()}
function fill(){let h=data.home||{},b=data.book||{},a=data.about||{},s=data.style||{};$('mainQuote').value=h.mainQuote||'';$('intro').value=h.introText||'';$('heroImage').value=h.heroImage||'';$('featured').value=h.featuredExcerpt||'';$('bookDesc').value=b.description||'';$('cover').value=b.coverImage||'';$('bio').value=a.bio||'';$('primary').value=s.primary||'#8B0000';$('gold').value=s.gold||'#D4AF37';$('titleFont').value=s.titleFont||'Aref Ruqaa';$('bodyFont').value=s.bodyFont||'Tajawal';$('titleSize').value=s.titleSize||36;$('bodySize').value=s.bodySize||18;renderChapters();renderPoems();renderQuotes()}
async function saveSection(section,payload){let r=await api('/api/admin/update',{method:'POST',body:JSON.stringify({section,payload})});return r}
async function saveHome(){let r=await saveSection('home',{mainQuote:$('mainQuote').value,introText:$('intro').value,heroImage:$('heroImage').value,featuredExcerpt:$('featured').value});$('homeStatus').textContent=r.message;data=await (await fetch('/api/content')).json()}
async function saveBook(){let r=await saveSection('book',{description:$('bookDesc').value,coverImage:$('cover').value});$('bookStatus').textContent=r.message;data=await (await fetch('/api/content')).json();renderChapters()}
function renderChapters(){$('chapters').innerHTML=(data.book?.chapters||[]).map(c=>`<div class=item><b>${esc(c.title)}</b><p>${esc(c.content.slice(0,180))}</p><button class="btn outline" onclick='editChapter(${JSON.stringify(c)})'>تعديل</button> <button class="btn danger" onclick="delChapter('${c.id}')">حذف</button></div>`).join('')||'<div class=item>لا توجد فصول.</div>'}
function editChapter(c){$('chapterId').value=c.id;$('chapterTitle').value=c.title;$('chapterContent').value=c.content;$('chapterYoutube').value=c.youtubeUrl||''}function clearChapter(){$('chapterId').value='';$('chapterTitle').value='';$('chapterContent').value='';$('chapterYoutube').value=''}
async function saveChapter(){await api('/api/admin/book/chapters',{method:'POST',body:JSON.stringify({id:$('chapterId').value,title:$('chapterTitle').value,content:$('chapterContent').value,youtubeUrl:$('chapterYoutube').value})});data=await (await fetch('/api/content')).json();clearChapter();renderChapters()}async function delChapter(id){if(!confirm('حذف الفصل؟'))return;await api('/api/admin/book/chapters/'+id,{method:'DELETE'});data=await (await fetch('/api/content')).json();renderChapters()}
function renderPoems(){$('poemsList').innerHTML=(data.poems||[]).map(p=>`<div class=item><h3>${esc(p.title)}</h3><small>${esc(p.type||'')}</small><p>${esc(p.reason||'')}</p><button class="btn outline" onclick='editPoem(${JSON.stringify(p)})'>تعديل</button> <button class="btn danger" onclick="delPoem('${p.id}')">حذف</button></div>`).join('')||'<div class=item>لا توجد قصائد.</div>'}function editPoem(p){$('poemId').value=p.id;$('poemTitle').value=p.title;$('poemType').value=p.type;$('poemReason').value=p.reason||'';$('poemContent').value=p.content;$('poemFont').value=p.font||'Amiri';$('poemSize').value=p.size||22;$('poemColor').value=p.color||'#2a2521'}function clearPoem(){['poemId','poemTitle','poemReason','poemContent'].forEach(x=>$(x).value='')}async function savePoem(){await api('/api/admin/poems',{method:'POST',body:JSON.stringify({id:$('poemId').value,title:$('poemTitle').value,type:$('poemType').value,reason:$('poemReason').value,content:$('poemContent').value,font:$('poemFont').value,size:$('poemSize').value,color:$('poemColor').value})});data=await (await fetch('/api/content')).json();clearPoem();renderPoems()}async function delPoem(id){if(confirm('حذف القصيدة؟')){await api('/api/admin/poems/'+id,{method:'DELETE'});data=await (await fetch('/api/content')).json();renderPoems()}}
function renderQuotes(){$('quotesList').innerHTML=(data.quotes||[]).map(q=>`<div class=item><h3>${esc(q.title)}</h3><p>${esc(q.text)}</p><button class="btn outline" onclick='editQuote(${JSON.stringify(q)})'>تعديل</button> <button class="btn danger" onclick="delQuote('${q.id}')">حذف</button></div>`).join('')||'<div class=item>لا توجد مقتطفات.</div>'}function editQuote(q){$('quoteId').value=q.id;$('quoteTitle').value=q.title||'';$('quoteText').value=q.text;$('quoteFont').value=q.font||'Amiri';$('quoteSize').value=q.size||24;$('quoteColor').value=q.color||'#2a2521'}async function saveQuote(){await api('/api/admin/quotes',{method:'POST',body:JSON.stringify({id:$('quoteId').value,title:$('quoteTitle').value,text:$('quoteText').value,font:$('quoteFont').value,size:$('quoteSize').value,color:$('quoteColor').value})});data=await (await fetch('/api/content')).json();$('quoteId').value='';$('quoteTitle').value='';$('quoteText').value='';renderQuotes()}async function delQuote(id){if(confirm('حذف المقتطف؟')){await api('/api/admin/quotes/'+id,{method:'DELETE'});data=await (await fetch('/api/content')).json();renderQuotes()}}
async function saveAbout(){await saveSection('about',{bio:$('bio').value});alert('تم حفظ السيرة')};async function saveStyle(){await saveSection('style',{primary:$('primary').value,gold:$('gold').value,titleFont:$('titleFont').value,bodyFont:$('bodyFont').value,titleSize:$('titleSize').value,bodySize:$('bodySize').value});alert('تم حفظ التصميم')};async function messages(){try{let d=await api('/api/admin/messages');$('messagesList').innerHTML=(d.messages||[]).map(m=>`<div class=item><small>${new Date(m.createdAt).toLocaleString('ar')}</small><p>${esc(m.message)}</p></div>`).join('')||'<div class=item>لا توجد رسائل.</div>'}catch(e){}}
function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}if(token)start();
</script></body></html>
