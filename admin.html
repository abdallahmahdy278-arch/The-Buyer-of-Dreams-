<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة التحكم — بائعة الأحلام</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Amiri&family=Aref+Ruqaa&family=Cairo&family=Changa&family=Lemonada&family=Reem+Kufi&family=Scheherazade+New&family=Tajawal&display=swap" rel="stylesheet">
<link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
<style>
:root{--primary:#8B1A1A;--gold:#C9A227;--text:#3E3A39;--bg:#F7EFE0;--card:#FFFDF8}*{box-sizing:border-box}body{margin:0;font-family:Tajawal,sans-serif;background:var(--bg);color:var(--text);line-height:1.8}button{cursor:pointer;font:inherit}.hidden{display:none!important}.topbar{background:#2c1a12;color:#ffe9a8;padding:14px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.topbar button,.btn{border:0;border-radius:25px;padding:8px 18px;background:var(--primary);color:#fff8ec}.topbar button{background:#ffffff18;border:1px solid #c9a22766}.body-wrap{display:flex}.tabs{width:215px;background:var(--card);padding:12px;display:flex;flex-direction:column;gap:5px}.tabs button{border:0;background:none;text-align:right;padding:10px;border-radius:9px}.tabs button.active,.tabs button:hover{background:var(--primary);color:white}.tab-content{flex:1;padding:26px;max-width:1050px}.card,.item{background:var(--card);border:1px solid #e8dcc0;border-radius:14px;padding:20px;margin-bottom:18px}.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.field{margin-bottom:12px}.field label{display:block;font-weight:700;color:var(--primary);font-size:14px}.field input,.field select,.field textarea{width:100%;padding:9px;border:1px solid #e8dcc0;border-radius:8px;background:#fffdf8}.field textarea{min-height:100px}.ql-container{min-height:260px;background:#fffdf8}.ql-toolbar{background:#fbf6ea}.item{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.actions{display:flex;gap:6px;flex-wrap:wrap}.small{padding:5px 12px;font-size:13px}.gold{background:var(--gold);color:#2c1a12}.gray{background:#e9e0cd;color:#5c4f3e}.red{background:#a32626}.cp-row{display:grid;grid-template-columns:1fr 70px 1fr auto;gap:8px;margin:8px 0}.cp-row input{padding:9px;border:1px solid #e8dcc0;border-radius:8px;background:#fffdf8}.state{font-size:12px;color:#8a6d1c;background:#f5e9bd;padding:2px 9px;border-radius:20px}@media(max-width:820px){.body-wrap{display:block}.tabs{width:100%;flex-direction:row;flex-wrap:wrap}.tabs button{flex:1;min-width:120px;text-align:center}.tab-content{padding:16px}.cp-row{grid-template-columns:1fr 60px 1fr}.cp-row button{grid-column:1/-1}}
</style></head>
<body>
<section id="loginScreen"><div class="card" style="max-width:400px;margin:15vh auto;text-align:center"><h1>بائعة الأحلام</h1><p>لوحة التحكم</p><input id="pwdInput" type="password" placeholder="كلمة المرور"><div id="loginErr" style="color:#b31212;min-height:24px"></div><button class="btn" id="loginBtn">دخول</button></div></section>
<section id="panel" class="hidden"><header class="topbar"><strong>✦ لوحة التحكم — بائعة الأحلام</strong><div><button id="siteBtn">عرض الموقع</button><button id="logoutBtn">تسجيل الخروج</button></div></header><div class="body-wrap"><nav class="tabs" id="tabs"><button data-tab="home">الرئيسية</button><button data-tab="book">الكتاب</button><button data-tab="poems">القصائد</button><button data-tab="excerpts">المقتطفات الشعرية</button><button data-tab="about">عن الكاتب</button><button data-tab="contact">التواصل</button><button data-tab="social">روابط التواصل</button><button data-tab="theme">التخصيص البصري</button></nav><main id="tabContent" class="tab-content"></main></div></section><div id="toast" style="position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#8b1a1a;color:white;padding:10px 24px;border-radius:25px;display:none"></div>
<script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script><script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const FONTS=['Amiri','Aref Ruqaa','Tajawal','Cairo','Reem Kufi','Lemonada','Changa','Scheherazade New'];let CONTENT=null,TOKEN=localStorage.getItem('admin_token')||'',editor=null,editingChapterId=null,editingPoemId=null,editingExcerptId=null;
const uid=()=> 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);function toast(m){let t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',2500)}function headers(){return {'Content-Type':'application/json',...(TOKEN?{Authorization:'Bearer '+TOKEN}:{})}}async function api(path,opt={}){let r=await fetch(path,{...opt,headers:{...headers(),...(opt.headers||{})}}),b=await r.json().catch(()=>({}));if(r.status===401){showLogin();throw Error('auth')}return{status:r.status,body:b}}
function showLogin(){$('#loginScreen').classList.remove('hidden');$('#panel').classList.add('hidden')}function enter(){$('#loginScreen').classList.add('hidden');$('#panel').classList.remove('hidden');loadAll()}async function loadAll(){let r=await api('/api/content');CONTENT=r.body;switchTab('home')}
$('#loginBtn').onclick=async()=>{let r=await api('/api/login',{method:'POST',body:JSON.stringify({password:$('#pwdInput').value})});if(r.body.ok){TOKEN=localStorage.getItem('admin_token')||'';enter()}else $('#loginErr').textContent=r.body.error||'كلمة المرور غير صحيحة'};$('#pwdInput').onkeydown=e=>e.key==='Enter'&&$('#loginBtn').click();$('#logoutBtn').onclick=async()=>{await api('/api/logout',{method:'POST'});localStorage.removeItem('admin_token');TOKEN='';showLogin()};$('#siteBtn').onclick=()=>location.href='/';
async function save(){let r=await api('/api/content',{method:'PUT',body:JSON.stringify(CONTENT)});toast(r.body.ok?'تم الحفظ بنجاح ✓':r.body.error||'خطأ')}
const fontOptions=(id,v='')=>`<select id="${id}"><option value="">— اختر —</option>${FONTS.map(f=>`<option ${f===v?'selected':''}>${f}</option>`).join('')}</select>`;
$('#tabs').onclick=e=>{let b=e.target.closest('button');if(b)switchTab(b.dataset.tab)};function switchTab(t){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));({home:tabHome,book:tabBook,poems:tabPoems,excerpts:tabExcerpts,about:tabAbout,contact:tabContact,social:tabSocial,theme:tabTheme}[t]||tabHome)()}
function tabHome(){let h=CONTENT.hero.quote,d=CONTENT.dailyExcerpt;$('#tabContent').innerHTML=`<h2>الرئيسية</h2><div class="card"><div class="field"><label>العبارة الرئيسية</label><textarea id="hText">${esc(h.text)}</textarea></div><div class="form-row"><div class="field"><label>الخط</label>${fontOptions('hFont',h.font)}</div><div class="field"><label>الحجم</label><input id="hSize" type="number" value="${h.fontSize||26}"></div><div class="field"><label>اللون</label><input id="hColor" type="color" value="${h.color||'#8B1A1A'}"></div></div><button class="btn" onclick="saveHome()">حفظ</button></div><div class="card"><div class="field"><label>مقتطف اليوم</label><textarea id="dText">${esc(d.text)}</textarea></div><button class="btn" onclick="saveDaily()">حفظ المقتطف</button></div>`}function saveHome(){Object.assign(CONTENT.hero.quote,{text:$('#hText').value,font:$('#hFont').value||'Amiri',fontSize:+$('#hSize').value,color:$('#hColor').value});save()}function saveDaily(){CONTENT.dailyExcerpt.text=$('#dText').value;save()}
function initEditor(html=''){if(!editor){Quill.register('formats/font',Quill.import('formats/font'),true);let Font=Quill.import('formats/font');Font.whitelist=FONTS;Quill.register(Font,true);let Size=Quill.import('formats/size');Size.whitelist=['small','normal','large','huge'];Quill.register(Size,true);editor=new Quill('#editor',{theme:'snow',modules:{toolbar:[[{font:FONTS},{size:['small',false,'large','huge']}],['bold','italic','underline'],[{color:[]}],[{align:[]}],[{list:'ordered'},{list:'bullet'}]]}})}editor.root.innerHTML=html}
function renderChapters(){return CONTENT.book.chapters.map((c,i)=>`<div class="item"><span>${esc(c.title)} <span class="state">${c.locked?'مغلق':'مفتوح'}</span></span><div class="actions"><button class="btn small gold" onclick="toggleChapter('${c.id}')">${c.locked?'فتح':'إغلاق'}</button><button class="btn small" onclick="editChapter('${c.id}')">تعديل</button><button class="btn small red" onclick="delChapter('${c.id}')">حذف</button></div></div>`).join('')||'لا توجد فصول'}
function tabBook(){let b=CONTENT.book;$('#tabContent').innerHTML=`<h2>كتاب الأحلام</h2><div class="card"><label>اسم الكتاب</label><input id="bookTitle" value="${esc(b.title)}"><label>النبذة</label><textarea id="bookBlurb">${esc(b.blurb.text)}</textarea><button class="btn" onclick="saveBook()">حفظ بيانات الكتاب</button></div><div class="card"><h3>فصول الكتاب</h3><div id="chaptersList">${renderChapters()}</div><button class="btn gold" onclick="newChapter()">+ إضافة فصل</button></div><div id="chapterEditor" class="card hidden"><h3 id="chHeading">إضافة فصل</h3><label>عنوان الفصل</label><input id="chTitle"><label>محتوى الفصل — حدّد النص لتنسيقه</label><div id="editor"></div><div class="form-row"><div class="field"><label>إدراج قصيدة في موضع المؤشر</label><select id="chPoem"><option value="">اختر قصيدة</option>${CONTENT.poems.map(p=>`<option value="${p.id}">${esc(p.title)}</option>`).join('')}</select><button class="btn small gold" onclick="insertPoem()">إدراج قصيدة</button></div><div class="field"><label>رابط فيديو YouTube</label><input id="chYt"></div></div><button class="btn" onclick="saveChapter()">حفظ الفصل</button> <button class="btn gray" onclick="$('#chapterEditor').classList.add('hidden')">إلغاء</button></div>`}
function saveBook(){CONTENT.book.title=$('#bookTitle').value;CONTENT.book.blurb.text=$('#bookBlurb').value;save()}function newChapter(){editingChapterId=null;$('#chapterEditor').classList.remove('hidden');$('#chHeading').textContent='إضافة فصل';$('#chTitle').value='';$('#chYt').value='';initEditor('');}function editChapter(id){let c=CONTENT.book.chapters.find(x=>x.id===id);if(!c)return;editingChapterId=id;$('#chapterEditor').classList.remove('hidden');$('#chHeading').textContent='تعديل: '+c.title;$('#chTitle').value=c.title;$('#chYt').value=c.youtubeUrl||'';initEditor(c.content||'')}function insertPoem(){let id=$('#chPoem').value;if(!id||!editor)return;let r=editor.getSelection(true);editor.insertText(r?r.index:editor.getLength(),'[[POEM:'+id+']]');toast('أُدرجت القصيدة في موضع المؤشر')}function saveChapter(){let title=$('#chTitle').value.trim();if(!title)return toast('يرجى كتابة عنوان الفصل');let data={title,content:editor.root.innerHTML,youtubeUrl:$('#chYt').value.trim(),style:{}};let ids=[...data.content.matchAll(/\[\[POEM:([^\]]+)\]\]/g)].map(m=>m[1]);data.blocks=ids.map(id=>({type:'poem',poemId:id}));if(editingChapterId)Object.assign(CONTENT.book.chapters.find(c=>c.id===editingChapterId),data);else CONTENT.book.chapters.push({id:uid(),locked:false,...data});save();tabBook()}function toggleChapter(id){let c=CONTENT.book.chapters.find(x=>x.id===id);c.locked=!c.locked;save();tabBook()}function delChapter(id){if(confirm('حذف الفصل؟')){CONTENT.book.chapters=CONTENT.book.chapters.filter(c=>c.id!==id);save();tabBook()}}
function poemRows(lines=[]){return lines.length?lines.map(l=>row(l.a,l.sep,l.b)).join(''):row('','—','')}function row(a='',s='—',b=''){return `<div class="cp-row"><input class="cp-a" value="${esc(a)}" placeholder="الشطر الأيمن"><input class="cp-sep" value="${esc(s)}"><input class="cp-b" value="${esc(b)}" placeholder="الشطر الأيسر"><button class="btn small red" onclick="this.parentElement.remove()">×</button></div>`}function tabPoems(){let p=CONTENT.poems.at(-1)||{};$('#tabContent').innerHTML=`<h2>القصائد</h2><div class="card"><h3 id="pHeading">إضافة قصيدة</h3><input id="pTitle" placeholder="اسم القصيدة"><select id="pType"><option value="vertical">شعر عمودي</option><option value="free">شعر حر / تفعيلة</option></select><textarea id="pReason" placeholder="سبب كتابة القصيدة"></textarea><div id="verticalBox"><div id="rows">${poemRows()}</div><button class="btn small gold" onclick="$('#rows').insertAdjacentHTML('beforeend',row())">+ إضافة بيت</button></div><div id="freeBox" class="hidden"><div id="poemEditor"></div></div><div class="form-row"><div class="field"><label>الخط</label>${fontOptions('pFont')}</div><div class="field"><label>الحجم</label><input id="pSize" type="number" value="22"></div><div class="field"><label>اللون</label><input id="pColor" type="color" value="#33302E"></div></div><button class="btn" onclick="savePoem()">حفظ القصيدة</button><button class="btn gray" onclick="resetPoem()">تفريغ</button></div><div class="card"><h3>القصائد الموجودة</h3>${CONTENT.poems.map(p=>`<div class="item"><span>${esc(p.title)} <span class="state">${p.locked?'مغلق':'مفتوح'}</span></span><div class="actions"><button class="btn small gold" onclick="togglePoem('${p.id}')">${p.locked?'فتح':'إغلاق'}</button><button class="btn small" onclick="editPoem('${p.id}')">تعديل</button><button class="btn small red" onclick="delPoem('${p.id}')">حذف</button></div></div>`).join('')}</div>`;$('#pType').onchange=()=>{$('#verticalBox').classList.toggle('hidden',$('#pType').value!=='vertical');$('#freeBox').classList.toggle('hidden',$('#pType').value==='vertical')};initEditorForPoem();}
let poemEditor=null;function initEditorForPoem(){poemEditor=new Quill('#poemEditor',{theme:'snow',modules:{toolbar:[[{font:FONTS},{size:['small',false,'large','huge']}],['bold','italic','underline'],[{color:[]}]]}})}function resetPoem(){editingPoemId=null;tabPoems()}function editPoem(id){let p=CONTENT.poems.find(x=>x.id===id);if(!p)return;editingPoemId=id;tabPoems();$('#pHeading').textContent='تعديل: '+p.title;$('#pTitle').value=p.title;$('#pType').value=p.type;$('#pReason').value=p.reason||'';$('#pFont').value=p.style?.font||'Amiri';$('#pSize').value=p.style?.fontSize||22;$('#rows').innerHTML=poemRows(p.lines||[]);if(p.type==='free'){ $('#pType').dispatchEvent(new Event('change'));poemEditor.root.innerHTML=p.content||''}}
function savePoem(){let title=$('#pTitle').value.trim(),type=$('#pType').value,lines=[];if(type==='vertical')document.querySelectorAll('.cp-row').forEach(r=>{if(r.querySelector('.cp-a').value||r.querySelector('.cp-b').value)lines.push({a:r.querySelector('.cp-a').value,sep:r.querySelector('.cp-sep').value,b:r.querySelector('.cp-b').value})});let data={title,type,reason:$('#pReason').value,lines,content:type==='free'?poemEditor.root.innerHTML:'',style:{font:$('#pFont').value||'Amiri',fontSize:+$('#pSize').value||22,color:$('#pColor').value}};if(editingPoemId)Object.assign(CONTENT.poems.find(p=>p.id===editingPoemId),data);else CONTENT.poems.push({id:uid(),locked:false,...data});save();tabPoems()}function togglePoem(id){let p=CONTENT.poems.find(x=>x.id===id);p.locked=!p.locked;save();tabPoems()}function delPoem(id){if(confirm('حذف القصيدة؟')){CONTENT.poems=CONTENT.poems.filter(p=>p.id!==id);save();tabPoems()}}
function tabExcerpts(){let es=CONTENT.excerpts;$('#tabContent').innerHTML=`<h2>المقتطفات الشعرية</h2><div class="card"><h3 id="eHeading">إضافة مقتطف</h3><input id="eTitle" placeholder="العنوان"><div id="excerptEditor"></div><button class="btn" onclick="saveExcerpt()">حفظ المقتطف</button></div><div class="card">${es.map(e=>`<div class="item"><span>${esc(e.title||'مقتطف')}</span><button class="btn small" onclick="editExcerpt('${e.id}')">تعديل</button></div>`).join('')}</div>`;window.excerptEditor=new Quill('#excerptEditor',{theme:'snow',modules:{toolbar:[[{font:FONTS},{size:['small',false,'large','huge']}],['bold','italic','underline'],[{color:[]}]]}})}function editExcerpt(id){let e=CONTENT.excerpts.find(x=>x.id===id);editingExcerptId=id;tabExcerpts();$('#eTitle').value=e.title||'';excerptEditor.root.innerHTML=e.text||''}function saveExcerpt(){let data={title:$('#eTitle').value,text:excerptEditor.root.innerHTML,style:{}};if(editingExcerptId)Object.assign(CONTENT.excerpts.find(e=>e.id===editingExcerptId),data);else CONTENT.excerpts.push({id:uid(),...data});save();tabExcerpts()}
function tabAbout(){let a=CONTENT.about;$('#tabContent').innerHTML=`<h2>عن الكاتب</h2><div class="card"><textarea id="aboutText">${esc(a.text)}</textarea><button class="btn" onclick="CONTENT.about.text=$('#aboutText').value;save()">حفظ</button></div>`}function tabContact(){api('/api/messages').then(r=>$('#tabContent').innerHTML='<h2>التواصل</h2>'+r.body.messages.map(m=>`<div class="item">${esc(m.name)}: ${esc(m.message)}</div>`).join(''))}function tabSocial(){let s=CONTENT.social;$('#tabContent').innerHTML=`<h2>روابط التواصل</h2><div class="card"><textarea id="social">${esc(JSON.stringify(s,null,2))}</textarea><button class="btn" onclick="try{CONTENT.social=JSON.parse($('#social').value);save()}catch(e){toast('JSON غير صالح')}">حفظ</button></div>`}function tabTheme(){let t=CONTENT.theme;$('#tabContent').innerHTML=`<h2>التخصيص البصري</h2><div class="card"><p>الألوان والخطوط محفوظة في المحتوى الحالي.</p><button class="btn" onclick="save()">حفظ</button></div>`}
api('/api/me').then(r=>r.body.authenticated?enter():showLogin()).catch(showLogin);
</script></body></html>
