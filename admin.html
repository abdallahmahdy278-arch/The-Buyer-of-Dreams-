<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>بائعة الأحلام — لوحة التحكم</title>
<meta name="google-site-verification" content="lbu-K_ctUG_UnNtplW7TMyoLlybaM8QAAkhsG2ciWz4" />
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@400;500;700&family=Cairo:wght@400;600;700&family=Reem+Kufi:wght@400;700&family=Lemonada:wght@400;700&family=Changa:wght@400;600;700&family=Scheherazade+New:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Noto+Serif+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@400;500;600;700&family=Markazi+Text:wght@400;500;600;700&family=Readex+Pro:wght@400;500;600;700&family=El+Messiri:wght@400;500;600;700&family=Mada:wght@400;500;600;700&family=Marhey:wght@400;500;600;700&family=Lateef:wght@400;500;600;700&family=Harmattan:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet" />
<style>
:root{--primary:#8B1A1A;--gold:#C9A227;--text:#3E3A39;--bg:#F7EFE0;--card:#FFFDF8;--base-font:'Tajawal',sans-serif;--heading-font:'Aref Ruqaa',serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--base-font);background:var(--bg);color:var(--text);line-height:1.8}
button{cursor:pointer;font-family:inherit}
input,select,textarea{font-family:inherit}
.hidden{display:none!important}
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:var(--card);border:1px solid rgba(201,162,39,.5);border-radius:16px;box-shadow:0 12px 40px rgba(80,40,20,.14);padding:44px 38px;width:100%;max-width:400px;text-align:center}
.login-box h1{font-family:var(--heading-font);color:var(--primary);font-size:30px;margin-bottom:6px}
.login-box p{color:var(--gold);margin-bottom:24px}
.login-box input{width:100%;border:1.5px solid #e8dcc0;border-radius:10px;padding:13px 16px;font-size:16px;margin-bottom:14px;outline:none;background:#fffdf8}
.login-box input:focus{border-color:var(--primary)}
.login-box button{width:100%;background:var(--primary);color:#FFF8EC;border:none;border-radius:30px;padding:13px;font-size:17px;font-weight:700}
.login-box .err{color:#b31212;font-size:14px;min-height:20px;margin-bottom:6px}
#panel{min-height:100vh;display:flex;flex-direction:column}
.topbar{background:#2c1a12;color:#e9dfc9;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;border-bottom:3px solid var(--gold);position:sticky;top:0;z-index:50}
.topbar .t-title{font-family:var(--heading-font);font-size:22px;color:#ffe9a8}
.topbar .t-left{display:flex;align-items:center;gap:14px}
.badge{background:var(--gold);color:#2c1a12;border-radius:30px;padding:3px 14px;font-weight:700;font-size:14px}
.topbar button{background:rgba(255,255,255,.1);color:#e9dfc9;border:1px solid rgba(201,162,39,.4);border-radius:30px;padding:7px 18px;font-size:14.5px}
.topbar button:hover{background:rgba(201,162,39,.25)}
.body-wrap{display:flex;flex:1}
.tabs{width:210px;background:var(--card);border-left:1px solid #e8dcc0;padding:16px 10px;display:flex;flex-direction:column;gap:4px}
.tabs button{background:none;border:none;border-radius:10px;padding:11px 14px;font-size:15px;font-weight:600;text-align:right;color:var(--text);transition:.2s}
.tabs button:hover{background:rgba(139,26,26,.07);color:var(--primary)}
.tabs button.active{background:var(--primary);color:#FFF8EC}
.tab-content{flex:1;padding:28px 30px;max-width:1000px;overflow-x:auto}
h2.sec-title{font-family:var(--heading-font);color:var(--primary);font-size:26px;margin-bottom:4px}
p.sec-sub{color:var(--gold);margin-bottom:22px;font-size:14.5px}
.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:14px}
.field label{display:block;font-size:13.5px;font-weight:700;color:var(--primary);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;border:1.5px solid #e8dcc0;border-radius:9px;padding:10px 13px;font-size:15px;background:#fffdf8;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary)}
.field textarea{resize:vertical;min-height:90px}
.field input[type=color]{height:44px;padding:4px;cursor:pointer}

/* Quill */
.ql-container{font-size:16px;font-family:'Tajawal',sans-serif;min-height:250px;background:#fffdf8;border-bottom-left-radius:9px;border-bottom-right-radius:9px}
.ql-toolbar{background:#fbf6ea;border-top-left-radius:9px;border-top-right-radius:9px;border-color:#e8dcc0 !important}
.ql-container{border-color:#e8dcc0 !important}

/* ===== بلوك القصيدة المضمن داخل محرر الفصل ===== */
.poem-block{background:linear-gradient(145deg,#fffaf0,#fbf1dd);border:1px solid rgba(201,162,39,.55);border-radius:9px;padding:24px 18px;position:relative;margin:14px 0}
.poem-block .pb-grip{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;background:rgba(201,162,39,.16);color:#8a6d1c;border-radius:6px;padding:6px 10px;font-size:13px}
.poem-block .pb-grip button{background:none;border:1px solid rgba(201,162,39,.5);padding:3px 10px;border-radius:6px;font-size:13px;color:#8a6d1c}
.poem-block .pb-grip button:hover{background:rgba(201,162,39,.3)}
.poem-block .pb-title{font-family:var(--heading-font);color:var(--primary);text-align:center;font-size:20px;margin-bottom:6px}
.poem-block .pb-bayt{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center;direction:rtl;margin:0 auto 10px;max-width:700px}
.poem-block .pb-bayt .pb-a{text-align:start;justify-self:start}
.poem-block .pb-bayt .pb-sep{color:var(--gold);font-weight:700;justify-self:center;white-space:nowrap}
.poem-block .pb-bayt .pb-b{text-align:end;justify-self:end}
@media (max-width:540px){
  .poem-block .pb-bayt{grid-template-columns:1fr;gap:4px;text-align:center;max-width:100%}
  .poem-block .pb-bayt .pb-a,.poem-block .pb-bayt .pb-b{text-align:center;justify-self:stretch}
  .poem-block .pb-bayt .pb-sep{justify-self:center}
}

.cp-row{margin-bottom:10px;background:#fbf6ea;border:1px solid #e8dcc0;border-radius:10px;padding:10px}
.cp-grid{display:grid;grid-template-columns:1fr 64px 1fr auto;gap:8px;align-items:center}
@media(max-width:640px){.cp-grid{grid-template-columns:1fr 70px 1fr}}
.cp-grid input{border:1.5px solid #e8dcc0;border-radius:8px;padding:9px 12px;font-size:15px;background:#fffdf8;outline:none;font-family:inherit}
.cp-grid input:focus{border-color:var(--primary)}
.card{background:var(--card);border:1px solid rgba(201,162,39,.4);border-radius:14px;padding:22px 24px;margin-bottom:22px;box-shadow:0 4px 14px rgba(80,40,20,.06)}
.card h3{font-family:var(--heading-font);color:var(--primary);font-size:20px;margin-bottom:14px}
.btn{background:var(--primary);color:#FFF8EC;border:none;border-radius:30px;padding:10px 26px;font-size:15px;font-weight:700;transition:.2s}
.btn:hover{background:#6f1414}
.btn.gold{background:var(--gold);color:#2c1a12}
.btn.gray{background:#e9e0cd;color:#5c4f3e}
.btn.red{background:#a32626;color:#fff}
.btn.small{padding:6px 14px;font-size:13.5px;border-radius:20px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;justify-content:flex-start}
/* مفتاح ON/OFF لقفل/فتح الفصل أو القصيدة */
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.switch input{display:none}
.switch .track{width:46px;height:24px;background:#cfcfcf;border-radius:24px;position:relative;transition:.25s}
.switch .track::after{content:'';position:absolute;top:2px;inset-inline-start:2px;width:20px;height:20px;background:#fff;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.25s}
.switch input:checked + .track{background:var(--primary)}
.switch input:checked + .track::after{inset-inline-start:auto;inset-inline-end:2px}
.switch .lbl{font-size:13px;color:#5c4f3e;font-weight:700}
.switch input:checked ~ .lbl{color:var(--primary)}

.item-list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--card);border:1px solid #e8dcc0;border-radius:12px;padding:13px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.item .it-main{display:flex;align-items:center;gap:12px;flex:1;min-width:180px}
.item .it-title{font-weight:700;font-size:16px}
.item .it-tag{font-size:12px;background:rgba(201,162,39,.16);color:#8a6d1c;border-radius:30px;padding:2px 10px}
.item .it-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.move-btn{background:none;border:1px solid #d8cbaa;border-radius:8px;padding:4px 10px;font-size:14px;color:#6b5848}
.move-btn:hover{background:rgba(201,162,39,.15)}
.move-btn:disabled{opacity:.35;cursor:not-allowed}

.msg-item{background:var(--card);border:1px solid #e8dcc0;border-radius:12px;padding:16px 20px;margin-bottom:12px}
.msg-item.unread{border-color:var(--gold);background:#fffaf0;box-shadow:0 3px 12px rgba(201,162,39,.18)}
.msg-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.msg-head .who{font-weight:700;color:var(--primary)}
.msg-head .when{font-size:13px;color:#8a8578}
.msg-head .state{font-size:12px;border-radius:30px;padding:2px 12px}
.msg-head .state.new{background:var(--gold);color:#2c1a12}
.msg-head .state.read{background:#e9e0cd;color:#6b5848}
.msg-body{white-space:pre-wrap;background:#fbf6ea;border-radius:8px;padding:12px 16px;margin-bottom:10px;font-size:15px}
.msg-actions{display:flex;gap:8px}

#notifBar{display:none;background:#fdf3d7;border:1px solid var(--gold);color:#7a5f14;border-radius:10px;padding:12px 18px;margin-bottom:18px;font-weight:700}
#notifBar.show{display:flex;align-items:center;gap:10px}

#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(130px);background:var(--primary);color:#FFF8EC;padding:13px 30px;border-radius:40px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:300;transition:.35s;font-weight:500}
#toast.show{transform:translateX(-50%) translateY(0)}

/* ===== نافذة اختيار القصيدة + بلوك مرجع القصيدة داخل المحرر ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(44,26,18,.55);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal-box{background:var(--card);border:1px solid rgba(201,162,39,.5);border-radius:14px;box-shadow:0 14px 44px rgba(0,0,0,.3);width:100%;max-width:520px;max-height:80vh;display:flex;flex-direction:column;overflow:hidden}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid #e8dcc0}
.modal-head h3{font-family:var(--heading-font);color:var(--primary);font-size:18px;margin:0}
.modal-close{background:none;border:none;font-size:22px;color:var(--primary);cursor:pointer;line-height:1;padding:2px 6px}
.modal-list{overflow-y:auto;padding:12px}
.modal-poem{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:right;background:#fbf6ea;border:1px solid #e8dcc0;border-radius:9px;padding:11px 14px;margin-bottom:8px;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;transition:.2s}
.modal-poem:hover{background:rgba(201,162,39,.18);border-color:var(--gold)}
.modal-poem .mp-type{font-size:12px;background:rgba(201,162,39,.16);color:#8a6d1c;border-radius:30px;padding:2px 10px;white-space:nowrap;font-weight:500}
.ql-editor .poem-ref{display:flex;align-items:center;gap:8px;background:rgba(201,162,39,.13);border:1px dashed rgba(201,162,39,.7);border-radius:8px;padding:10px 16px;margin:8px 0;font-size:14px;color:#6b5848;direction:rtl;line-height:1.7}

@media(max-width:820px){
.body-wrap{flex-direction:column}
.tabs{width:100%;flex-direction:row;flex-wrap:wrap;border-left:none;border-bottom:1px solid #e8dcc0;padding:10px}
.tabs button{flex:1;min-width:130px;text-align:center;font-size:14px}
.tab-content{padding:20px 16px}
.topbar .t-title{font-size:18px}
}

/* ===== الوضع الليلي (داكن / نهاري) ===== */
:root[data-theme="dark"]{--primary:#c2604a;--gold:#d4af37;--text:#e8dfd0;--bg:#1f1b17;--card:#2a241f}
:root[data-theme="dark"] body{background:var(--bg);color:var(--text)}
:root[data-theme="dark"] .login-box,:root[data-theme="dark"] .card,:root[data-theme="dark"] .item,:root[data-theme="dark"] .msg-item,:root[data-theme="dark"] .modal-box,:root[data-theme="dark"] .cp-row,:root[data-theme="dark"] .tabs,:root[data-theme="dark"] .modal-poem{background:var(--card);color:var(--text)}
:root[data-theme="dark"] .card,:root[data-theme="dark"] .item,:root[data-theme="dark"] .msg-item,:root[data-theme="dark"] .cp-row,:root[data-theme="dark"] .modal-poem,:root[data-theme="dark"] .login-box{border-color:#4a403a}
:root[data-theme="dark"] input,:root[data-theme="dark"] select,:root[data-theme="dark"] textarea,:root[data-theme="dark"] .cp-grid input{background:#241f1a;color:var(--text);border-color:#4a403a}
:root[data-theme="dark"] #tabContent .ql-toolbar{background:#241f1a;border-color:#4a403a}
:root[data-theme="dark"] #tabContent .ql-container,:root[data-theme="dark"] #tabContent .ql-editor{background:#241f1a;border-color:#4a403a;color:var(--text)}
:root[data-theme="dark"] .field label,:root[data-theme="dark"] h2.sec-title,:root[data-theme="dark"] .card h3,:root[data-theme="dark"] .msg-head .who,:root[data-theme="dark"] .item .it-title,:root[data-theme="dark"] .login-box h1{color:var(--gold)}
:root[data-theme="dark"] .tabs button{color:var(--text)}
:root[data-theme="dark"] .tabs button:hover{background:rgba(194,96,74,.12);color:var(--gold)}
:root[data-theme="dark"] .tabs button.active{background:var(--primary);color:#1a0d0a}
:root[data-theme="dark"] .topbar{background:#13100d}
:root[data-theme="dark"] .btn.gray{background:#3a332b;color:#d8cbb4}
:root[data-theme="dark"] .btn.red{background:#7e1f1f}
:root[data-theme="dark"] .switch .lbl{color:#b3a88f}
:root[data-theme="dark"] .msg-body{background:#241f1a;color:var(--text)}
:root[data-theme="dark"] #notifBar{background:#3a2f14;border-color:var(--gold);color:#ffd970}
:root[data-theme="dark"] .badge{background:var(--gold);color:#2c1a12}
:root[data-theme="dark"] .poem-block .pb-grip{background:rgba(201,162,39,.2);color:var(--gold)}
:root[data-theme="dark"] .ql-editor.ql-blank::before{color:#8a7f6d}
:root[data-theme="dark"] .move-btn{color:#c9b78f;border-color:#4a403a}

/* ===== شريط التنسيق العائم ===== */
#edWrap{position:relative}
#floatBar{position:absolute;z-index:140;display:flex;align-items:center;gap:5px;background:var(--card);border:1px solid rgba(201,162,39,.55);border-radius:30px;box-shadow:0 8px 24px rgba(0,0,0,.22);padding:5px 10px;white-space:nowrap;top:-56px;left:0}
#floatBar button{border:none;background:rgba(201,162,39,.16);border-radius:8px;padding:4px 11px;font-size:15px;font-weight:700;color:var(--primary);cursor:pointer;line-height:1.3}
#floatBar button:hover{background:var(--gold);color:#2c1a12}
#floatBar input[type=color]{width:27px;height:27px;padding:0;border:1px solid rgba(201,162,39,.5);border-radius:8px;cursor:pointer;background:none}
#floatBar .fb-sep{width:1px;height:20px;background:#e8dcc0;margin:0 4px}
#floatBar button[data-fmt=italic]{font-style:italic}
#floatBar button[data-fmt=underline]{text-decoration:underline}
:root[data-theme="dark"] #floatBar{background:#2a241f;border-color:rgba(212,175,55,.6)}
:root[data-theme="dark"] #floatBar button{background:rgba(201,162,39,.18);color:#ffd970}
:root[data-theme="dark"] #floatBar .fb-sep{background:#4a403a}
</style>
</head>
<body>

<div id="loginScreen">
<div class="login-box">
<h1>بائعة الأحلام</h1>
<p>لوحة التحكم</p>
<input id="pwdInput" type="password" placeholder="كلمة المرور" autocomplete="current-password" />
<div class="err" id="loginErr"></div>
<button id="loginBtn">دخول</button>
</div>
</div>

<div id="panel" class="hidden">
<div class="topbar">
<div class="t-title">✦ لوحة التحكم — بائعة الأحلام</div>
<div class="t-left">
<div id="msgBadge" class="badge hidden">🔔 جديدة</div>
<a href="/" target="_blank" style="background:rgba(255,255,255,.1);color:#e9dfc9;border:1px solid rgba(201,162,39,.4);border-radius:30px;padding:7px 18px;font-size:14.5px;text-decoration:none">عرض الموقع</a>
<button id="themeBtn" title="الوضع الليلي / النهاري" style="background:rgba(255,255,255,.1);border:1px solid rgba(201,162,39,.4);border-radius:30px;padding:6px 12px;font-size:16px;line-height:1">🌙</button>
<button id="logoutBtn">تسجيل الخروج</button>
</div>
</div>
<div class="body-wrap">
<div class="tabs" id="tabs">
<button data-tab="home" class="active">الرئيسية</button>
<button data-tab="book">الكتاب</button>
<button data-tab="poems">القصائد</button>
<button data-tab="excerpts">المقتطفات الشعرية</button>
<button data-tab="about">عن الكاتب</button>
<button data-tab="contact">التواصل</button>
<button data-tab="social">روابط التواصل</button>
<button data-tab="theme">التخصيص البصري</button>
</div>
<div class="tab-content" id="tabContent"></div>
</div>
</div>

<!-- ===== نافذة اختيار قصيدة للإدراج داخل الفصل ===== -->
<div class="modal-overlay" id="poemPickerModal">
<div class="modal-box">
<div class="modal-head">
<h3>اختر قصيدة للإدراج داخل الفصل</h3>
<button class="modal-close" onclick="closePoemPicker()" title="إغلاق">✕</button>
</div>
<div class="modal-list" id="poemPickerList"></div>
</div>
</div>

<div id="toast"></div>

<script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
<script>
const FONTS=["Amiri","Aref Ruqaa","Tajawal","Cairo","Reem Kufi","Lemonada","Changa","Scheherazade New","Noto Naskh Arabic","Noto Serif Arabic","Noto Kufi Arabic","Markazi Text","Readex Pro","El Messiri","Mada","Marhey","Lateef","Harmattan","IBM Plex Sans Arabic"];
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
let CONTENT=null, MESSAGES=[], TOKEN=localStorage.getItem('admin_token')||'', quillEditor=null;

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2400);}
function uid(){return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function authHeaders(extra){const h=Object.assign({'Content-Type':'application/json'},extra||{});if(TOKEN)h['Authorization']='Bearer '+TOKEN;return h;}
async function api(path,opt){
const r=await fetch(path,Object.assign({},opt,{headers:authHeaders(opt&&opt.headers)}));
const j=await r.json().catch(()=>({}));
if(r.status===401&&path!=='/api/messages'&&!path.includes('/api/login')){toast('انتهت الجلسة، سجّل الدخول مجددًا');showLogin();throw new Error('unauth');}
return {status:r.status,body:j};
}
const FONTS_AR={'Amiri':'أميري','Aref Ruqaa':'عارف رقعة','Tajawal':'تجوال','Cairo':'القاهرة','Reem Kufi':'ريم كوفي','Lemonada':'ليمونادا','Changa':'تشانغا','Scheherazade New':'شهرزاد الجديدة','Noto Naskh Arabic':'نوتو نسخ عربي','Noto Serif Arabic':'نوتو سريف عربي','Noto Kufi Arabic':'نوتو كوفي عربي','Markazi Text':'مركزي تكست','Readex Pro':'ريدكس برو','El Messiri':'المسيري','Mada':'مدى','Marhey':'مرحي','Lateef':'لطيف','Harmattan':'هرمطان','IBM Plex Sans Arabic':'آي بي إم بلكس عربي'};

modules:{

[{color:[]},{background:[]}],
[{align:[]}],
[{list:'ordered'},{list:'bullet'}],
['clean']
]
}
});
}
quillEditor.root.innerHTML = initialContent || '';
const _cfNow = document.getElementById('chFont');
if(_cfNow && _cfNow.value && quillEditor){ quillEditor.root.style.fontFamily = '"' + _cfNow.value + '", serif'; }
quillEditor.on('selection-change', function(range){
if(range && range.length > 0){ floatRange = {index: range.index, length: range.length}; placeFloatBar(); }
});

if(!window._fbBound){
window._fbBound = true;
document.addEventListener('mousedown', function(e){

});

/* ===== شريط التنسيق العائم ===== */
let floatRange = null, lastFormat = null;
function fbShow(){ const b = document.getElementById('floatBar'); if(b){ b.classList.remove('hidden'); } }
function fbHide(){ const b = document.getElementById('floatBar'); if(b){ b.classList.add('hidden'); } }
function placeFloatBar(){
const wrap = document.getElementById('edWrap'), bar = document.getElementById('floatBar');
if(!wrap || !bar || !quillEditor || !floatRange) return;
let r;
try { r = quillEditor.getBounds(floatRange.index, floatRange.length); } catch(err){ return; }
const ec = document.getElementById('editor-container');
if(!ec) return;
const er = ec.getBoundingClientRect();
const wr = wrap.getBoundingClientRect();
bar.style.left = Math.max(0, r.left + (er.left - wr.left)) + 'px';
bar.style.top = Math.max(-60, r.top + (er.top - wr.top) - 54) + 'px';
fbShow();
}
function applyFloatFormat(fn){
if(!quillEditor || !floatRange){ return; }
quillEditor.setSelection(floatRange.index, floatRange.length, 'silent');
fn();
lastFormat = fn;
placeFloatBar();
}
function fmtBold(){ quillEditor.format('bold', !(quillEditor.getFormat(floatRange.index, floatRange.length).bold || false)); }
function fmtItalic(){ quillEditor.format('italic', !(quillEditor.getFormat(floatRange.index, floatRange.length).italic || false)); }
function fmtUnderline(){ quillEditor.format('underline', !(quillEditor.getFormat(floatRange.index, floatRange.length).underline || false)); }
function fmtBigger(){
const cur = parseFloat((quillEditor.getFormat(floatRange.index, floatRange.length)['font-size'] || '').toString().replace('px','')) || 18;
quillEditor.formatText(floatRange.index, floatRange.length, {'font-size': Math.min(64, cur + 3) + 'px'}, 'user');
}
function fmtSmaller(){
const cur = parseFloat((quillEditor.getFormat(floatRange.index, floatRange.length)['font-size'] || '').toString().replace('px','')) || 18;
quillEditor.formatText(floatRange.index, floatRange.length, {'font-size': Math.max(10, cur - 3) + 'px'}, 'user');
}
function fmtColor(v){ quillEditor.format('color', v); }
function repeatLastFormat(){
if(!lastFormat){ toast('لا يوجد أمر تنسيق سابق للتكرار'); return; }
applyFloatFormat(lastFormat);
}
function bindFloatBar(){
const bar = document.getElementById('floatBar');
if(!bar || bar._bound) return;
bar._bound = true;
bar.querySelectorAll('[data-fmt]').forEach(function(b){
b.addEventListener('click', function(){
const k = b.getAttribute('data-fmt');
if(k === 'bold'){ applyFloatFormat(fmtBold); }
else if(k === 'italic'){ applyFloatFormat(fmtItalic); }
else if(k === 'underline'){ applyFloatFormat(fmtUnderline); }
});
});
const up = document.getElementById('fbBigger'); if(up) up.addEventListener('click', function(){ applyFloatFormat(fmtBigger); });
const dn = document.getElementById('fbSmaller'); if(dn) dn.addEventListener('click', function(){ applyFloatFormat(fmtSmaller); });
const col = document.getElementById('fbColor');
if(col) col.addEventListener('change', function(){ applyFloatFormat(function(){ fmtColor(col.value); }); });
const rp = document.getElementById('fbRepeat'); if(rp) rp.addEventListener('click', repeatLastFormat);
const cl = document.getElementById('fbClose'); if(cl) cl.addEventListener('click', fbHide);
}
function bindFontPreviews(){
const pairs = [
['hQuoteFont','hQuoteText'],['dFont','dText'],['bBlurbFont','bkBlurb'],['aFont','aText'],
['chHeadFont','chTitle'],['pFont','coupletsBox'],['eFont','excerptCoupletsBox']
];
pairs.forEach(function(pair){
const sel = document.getElementById(pair[0]);
if(!sel) return;
const apply = function(){
const t = document.getElementById(pair[1]);
const fam = sel.value ? '"' + sel.value + '", serif' : '';
if(!t) return;
if(t.tagName === 'DIV'){ t.querySelectorAll('input').forEach(function(i){ i.style.fontFamily = fam; }); }
else { t.style.fontFamily = fam; }
if(pair[0] === 'chHeadFont'){ const ti = document.getElementById('chTitle'); if(ti) ti.style.fontFamily = fam; }
};
sel.addEventListener('change', apply);
apply();
});
const stFont = document.getElementById('stFont');
if(stFont){ stFont.addEventListener('change', function(){ if(quillEditor) quillEditor.root.style.fontFamily = stFont.value ? '"' + stFont.value + '", serif' : ''; }); }
const chFont = document.getElementById('chFont');
if(chFont){ chFont.addEventListener('change', function(){ if(quillEditor) quillEditor.root.style.fontFamily = chFont.value ? '"' + chFont.value + '", serif' : ''; }); if(quillEditor) quillEditor.root.style.fontFamily = chFont.value ? '"' + chFont.value + '", serif' : ''; }
bindFloatBar();
}

/* ===== بلوت مخصص لمرجع القصيدة — يمنع Quill من حذف البيانات عند الإدراج والحفظ ===== */
const PoemRefBlock = Quill.import('blots/block/embed');
class PoemRefBlockClass extends PoemRefBlock {
  static create(value){
    const node = super.create();
    node.setAttribute('contenteditable','false');
    node.setAttribute('data-poem-id', value.id);
    node.classList.add('poem-ref');
    node.innerHTML =
      '<span style="font-size:18px">📜</span>'+
      '<span style="font-weight:700;color:#8B1A1A">' + esc(value.title || 'قصيدة') + '</span>'+
      '<span style="color:#8a6d1c;font-size:12px">إدراج قصيدة من المكتبة</span>';
    return node;
  }
  static value(node){
    return { id: node.getAttribute('data-poem-id'), title: (node.textContent || '').trim() };
  }
}
PoemRefBlockClass.blotName = 'poemRef';
PoemRefBlockClass.tagName = 'div';
Quill.register(PoemRefBlockClass, true);

/* بلوت دعم تكبير/تصغير حجم النص داخل المحرر */
const FontSizeInline = Quill.import('blots/inline');
class FontSizeInlineClass extends FontSizeInline {
  static create(value){
    const node = super.create();
    node.style.fontSize = value;
    node.setAttribute('data-font-size', value);
    return node;
  }
  static formats(node){
    return node.getAttribute('data-font-size') || node.style.fontSize || true;
  }
  static value(node){
    return node.getAttribute('data-font-size') || node.style.fontSize || '';
  }
}
FontSizeInlineClass.blotName = 'font-size';
FontSizeInlineClass.tagName = 'span';
Quill.register(FontSizeInlineClass, true);

window.pickPoem = function(id){
  const p = (CONTENT.poems || []).find(x => x.id === id);
  closePoemPicker();
  if(!p) return;
  insertPoemIntoEditor(p);
};

/* يُدرج مرجعًا حقيقيًا للقصيدة (بلوك يحمل data-poem-id) — الموقع يستبدله بنص القصيدة الكامل تلقائيًا */
function insertPoemIntoEditor(poem){
  if(!quillEditor){ return; }
  const range = quillEditor.getSelection(true);
  const index = range ? range.index : quillEditor.getLength();
  quillEditor.insertEmbed(index, 'poemRef', { id: poem.id, title: poem.title }, 'user');
  quillEditor.setSelection(index + 1, 0, 'silent');
  toast('تم إدراج القصيدة داخل الفصل ✓');
}

window.saveChapter=function(){

const content = quillEditor ? quillEditor.root.innerHTML : '';
const style={};
if(document.getElementById('chFont').value) style.font = document.getElementById('chFont').value;
if(document.getElementById('chSize').value) style.fontSize = +document.getElementById('chSize').value;

if(document.getElementById('chHeadFont').value) style.headingFont = document.getElementById('chHeadFont').value;

style.headingColor = document.getElementById('chHeadColor').value==='#8B1A1A' ? (CONTENT.book.defaultStyle.headingColor||'#8B1A1A') : document.getElementById('chHeadColor').value;
if(document.getElementById('chLH').value) style.lineHeight = +document.getElementById('chLH').value;
const data={

youtubeUrl: document.getElementById('chYt').value.trim(),
style,
part: parseInt(document.getElementById('chPart').value, 10) || 1,
locked: document.getElementById('chLocked').checked
};

data.id = uid();

}
saveContent();
tabBook();
};

<div class="field"><label>السيرة الذاتية</label><textarea id="aText" style="min-height:160px">${esc(a.text)}</textarea></div>
<div class="form-row">
<div class="field"><label>الخط</label>${fontOptions('aFont', a.font)}</div>
<div class="field"><label>حجم الخط</label><input id="aSize" type="number" value="${a.fontSize||18}"></div>
<div class="field"><label>لون النص</label><input id="aColor" type="color" value="${a.color||'#3E3A39'}"></div>
<div class="field"><label>تباعد الأسطر</label><input id="aLH" type="number" step="0.1" value="${a.lineHeight||2}"></div>
</div>
<div class="row-actions"><button class="btn" onclick="saveAbout()">حفظ السيرة</button></div>
</div>`;
}
window.saveAbout=function(){
CONTENT.about.text=document.getElementById('aText').value;
CONTENT.about.font=document.getElementById('aFont').value||CONTENT.about.font;
CONTENT.about.fontSize=+document.getElementById('aSize').value;
CONTENT.about.color=document.getElementById('aColor').value;
CONTENT.about.lineHeight=+document.getElementById('aLH').value;
saveContent();
};

/* ==== التواصل ==== */
function tabContact(){
const unread=MESSAGES.filter(m=>!m.read).length;
const notif = `<div id="notifBar" class="${unread?'show':''}" style="${unread?'display:flex':''}">🔔 رسالة جديدة من أحد زوار الموقع${unread>1?' ('+unread+' رسائل)':''}</div>`;
const list = MESSAGES.length ? MESSAGES.map(m=>{
const st = m.read?'مقروءة':'غير مقروءة';
return `<div class="msg-item ${m.read?'':'unread'}">
<div class="msg-head">
<span class="who">💬 ${esc(m.name)}</span>
<span class="when">${new Date(m.createdAt).toLocaleString('ar-EG')}</span>
<span class="state ${m.read?'read':'new'}">${st}</span>
</div>
<div class="msg-body">${esc(m.message)}</div>
<div class="msg-actions">
${m.read?'':`<button class="btn small gold" onclick="markRead('${m.id}')">وضع كمقروءة</button>`}
<button class="btn small red" onclick="delMsg('${m.id}')">حذف الرسالة</button>
</div>
</div>`;
}).join('') : '<div class="empty">لا توجد رسائل بعد</div>';
document.getElementById('tabContent').innerHTML=
`<h2 class="sec-title">التواصل</h2><p class="sec-sub">رسائل الزوار</p>
${notif}
<div class="card"><h3>صندوق الرسائل</h3>${list}</div>`;
}
window.markRead=async function(id){await api('/api/messages/'+id,{method:'PATCH'});await loadMessages();tabContact();toast('تم تحديدها كمقروءة');};
window.delMsg=async function(id){if(!confirm('هل أنت متأكد من حذف هذه الرسالة نهائيًا؟'))return;await api('/api/messages/'+id,{method:'DELETE'});await loadMessages();tabContact();toast('تم حذف الرسالة');};
